function IntakeBtn({ id, v, multi, vals, multiVals, setVal, toggleMulti }) {
  const active = multi ? (multiVals[id]||[]).includes(v) : vals[id]===v;
  return (
    <button onClick={()=>multi?toggleMulti(id,v):setVal(id,v)}
      style={{ padding:"9px 14px", borderRadius:8, border:"2px solid "+(active?C.amber:C.warm3), background:active?C.amberLight:C.white, color:active?C.amber:C.body, fontSize:13, fontWeight:active?700:500, fontFamily:F.b, cursor:"pointer", margin:"0 6px 6px 0", transition:"all 0.15s" }}>

}

// ── TAG PARSER ────────────────────────────────────────────────────────────────
function getTag(text, tag) {
  const m = text.match(new RegExp("\\[" + tag + "\\]([\\s\\S]*?)(?=\\[|$)"));
  return m ? m[1].trim() : "";
}

function SnapshotApp() {
  const [step, setStep] = useState("loading"); // loading | invalid | intake | section | generating | result | error
  const [token, setToken] = useState("");
  const [name, setName] = useState("");
  const [biz, setBiz] = useState("");
  const [trade, setTrade] = useState("");
  const [phone, setPhone] = useState("");
  const [section, setSection] = useState(0);
  const [vals, setVals] = useState({});
  const [multiVals, setMultiVals] = useState({});
  const [err, setErr] = useState("");
  const [result, setResult] = useState(null);
  const [email, setEmail] = useState("");

  const needsName = !name;
  const needsBiz = !biz;
  const needsTrade = !trade;

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const t = params.get("token");
    if (!t) { setStep("invalid"); return; }
    setToken(t);

    // Validate token
    fetch("/api/validate-snapshot-token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: t })
    }).then(r => r.json()).then(d => {
      if (d.valid) {
        setName(d.name || "");
        setBiz(d.biz || "");
        setEmail(d.email || "");
        setStep("intake");
      } else {
        setStep("invalid");
      }
    }).catch(() => setStep("invalid"));
  }, []);

  function setVal(id, v) { setVals(p=>({...p,[id]:v})); }
  function toggleMulti(id, v) {
    setMultiVals(p => {
      const cur = p[id]||[];
      return {...p,[id]:cur.includes(v)?cur.filter(x=>x!==v):[...cur,v]};
    });
  }

  async function generate() {
    setStep("generating");
    setErr("");
    try {
      const r = await fetch("/api/generate-snapshot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, vals, multiVals, name, biz, trade, phone })
      });
      const d = await r.json();
      if (d.success) {
        setResult(d.content);
        setStep("result");
        window.scrollTo(0,0);
      } else {
        setErr(d.error || "Something went wrong");
        setStep("error");
      }
    } catch(e) {
      setErr("Connection error. Please try again.");
      setStep("error");
    }
  }

  if (step === "loading") return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:C.navy }}>
      <div style={{ textAlign:"center", color:"white", fontFamily:F.b }}>
        <div style={{ fontSize:32, marginBottom:12 }}>⏳</div>
        <div>Loading your Snapshot...</div>
      </div>
    </div>
  );

  if (step === "invalid") return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:C.navy, padding:24 }}>
      <div style={{ background:"white", borderRadius:16, padding:"36px 32px", maxWidth:480, textAlign:"center" }}>
        <div style={{ fontSize:40, marginBottom:16 }}>🔒</div>
        <div style={{ fontFamily:F.d, fontSize:24, fontWeight:800, color:C.ink, marginBottom:12 }}>LINK EXPIRED OR INVALID</div>
        <p style={{ fontFamily:F.b, fontSize:14, color:C.body, lineHeight:1.7, marginBottom:20 }}>
          This link has expired or isn't valid. Check your email for the correct link, or contact us at hello@compassbizsolutions.com.
        </p>
        <a href="https://www.compassbizsolutions.com" style={{ fontFamily:F.b, fontSize:13, color:C.amber }}>← Back to site</a>
      </div>
    </div>
  );

  if (step === "generating") return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:C.navy, padding:24 }}>
      <div style={{ textAlign:"center", maxWidth:480 }}>
        <img src="/logo.png" alt="Compass" style={{ width:70, height:70, borderRadius:"50%", background:"white", padding:6, objectFit:"contain", marginBottom:20 }} />
        <div style={{ fontFamily:F.d, fontSize:32, fontWeight:800, color:"white", letterSpacing:2, marginBottom:12 }}>BUILDING YOUR SNAPSHOT</div>
        <p style={{ fontFamily:F.b, fontSize:14, color:"rgba(255,255,255,0.55)", lineHeight:1.7, marginBottom:24 }}>
          Analyzing your answers across all 10 profit leak categories. This takes about 20 seconds.
        </p>
        <div style={{ display:"flex", justifyContent:"center", gap:8 }}>
          {[0,1,2].map(i => (
            <div key={i} style={{ width:10, height:10, borderRadius:"50%", background:C.amber, animation:`pulse${i} 1.2s ease-in-out infinite`, animationDelay:`${i*0.2}s` }} />
          ))}
        </div>
      </div>
      <style>{`
        @keyframes pulse0{0%,100%{opacity:.3}50%{opacity:1}}
        @keyframes pulse1{0%,100%{opacity:.3}50%{opacity:1}}
        @keyframes pulse2{0%,100%{opacity:.3}50%{opacity:1}}
      `}</style>
    </div>
  );

  if (step === "result") return <SnapshotPDF result={result} name={name} biz={biz} trade={trade} email={email} />;

  if (step === "error") return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:C.navy, padding:24 }}>
      <div style={{ background:"white", borderRadius:16, padding:"36px 32px", maxWidth:480, textAlign:"center" }}>
        <div style={{ fontFamily:F.d, fontSize:20, fontWeight:800, color:C.red, marginBottom:12 }}>GENERATION FAILED</div>
        <p style={{ fontFamily:F.b, fontSize:14, color:C.body, marginBottom:20 }}>{err}</p>
        <button onClick={generate} style={{ background:C.amber, border:"none", color:"white", padding:"12px 24px", borderRadius:9, fontFamily:F.b, fontSize:14, fontWeight:700, cursor:"pointer" }}>Try Again</button>
      </div>
    </div>
  );

  // Intake
  const sec = SECTIONS[section];
  const pct = Math.round(((section) / SECTIONS.length) * 100);
  const firstName = name.split(" ")[0] || "there";

  return (
    <div style={{ minHeight:"100vh", background:C.navy }}>
      {/* Nav */}
      <div style={{ background:C.navyDark, padding:"0 20px" }}>
        <div style={{ maxWidth:600, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", height:52 }}>
          <div style={{ fontFamily:F.d, fontSize:13, fontWeight:800, color:"white", letterSpacing:1 }}>PROFIT LEAK SNAPSHOT</div>
          <div style={{ fontFamily:F.b, fontSize:11, color:"rgba(255,255,255,0.4)" }}>Section {section+1} of {SECTIONS.length}</div>
        </div>
      </div>

      {/* Progress */}
      <div style={{ background:"rgba(255,255,255,0.08)", height:4 }}>
        <div style={{ width:pct+"%", height:"100%", background:C.amber, transition:"width 0.4s" }} />
      </div>

      <div style={{ maxWidth:600, margin:"0 auto", padding:"24px 20px 80px" }}>
        {/* Welcome screen */}
        {section === 0 && (
          <div style={{ background:"rgba(255,255,255,0.06)", borderRadius:12, padding:"20px", marginBottom:20 }}>
            <div style={{ fontFamily:F.d, fontSize:22, fontWeight:800, color:"white", marginBottom:8 }}>LET'S BUILD YOUR SNAPSHOT</div>
            <p style={{ fontFamily:F.b, fontSize:13, color:"rgba(255,255,255,0.55)", lineHeight:1.65, margin:0 }}>
              Hi {firstName} — answer these questions about how your business runs. The more specific you are, the more accurate your leak estimates. Takes about 10 minutes.
            </p>
            {(needsName || needsBiz || needsTrade) && (
              <div style={{ marginTop:16 }}>
                {needsName && <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name"
                  style={{ width:"100%", padding:"11px 14px", border:"2px solid rgba(255,255,255,0.2)", borderRadius:8, fontSize:14, fontFamily:F.b, color:"white", outline:"none", boxSizing:"border-box", marginBottom:10, background:"rgba(255,255,255,0.08)" }} />}
                {needsBiz && <input value={biz} onChange={e=>setBiz(e.target.value)} placeholder="Business name"
                  style={{ width:"100%", padding:"11px 14px", border:"2px solid rgba(255,255,255,0.2)", borderRadius:8, fontSize:14, fontFamily:F.b, color:"white", outline:"none", boxSizing:"border-box", marginBottom:10, background:"rgba(255,255,255,0.08)" }} />}
                {needsTrade && (
                  <div>
                    <div style={{ fontFamily:F.b, fontSize:13, fontWeight:600, color:"rgba(255,255,255,0.6)", marginBottom:8 }}>What trade are you in?</div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                      {TRADES.map(t=>(
                        <button key={t} onClick={()=>setTrade(t)}
                          style={{ padding:"8px 12px", borderRadius:8, border:"2px solid "+(trade===t?C.amber:"rgba(255,255,255,0.2)"), background:trade===t?C.amberLight:"transparent", color:trade===t?C.amber:"rgba(255,255,255,0.6)", fontSize:12, fontFamily:F.b, cursor:"pointer" }}>
                          {t}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* Section card */}
        <div style={{ background:"white", borderRadius:16, padding:"24px 20px", boxShadow:"0 8px 40px rgba(0,0,0,0.3)" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20 }}>
            <div style={{ width:8, height:32, borderRadius:4, background:sec.color, flexShrink:0 }} />
            <div style={{ fontFamily:F.d, fontSize:18, fontWeight:800, color:C.ink, letterSpacing:1 }}>{sec.label}</div>
          </div>
          {sec.questions.map(q => (
            <Q key={q.id} {...q} vals={vals} multiVals={multiVals} setVal={setVal} toggleMulti={toggleMulti} />
          ))}
        </div>

        {/* Navigation */}
        <div style={{ display:"flex", gap:12, marginTop:16 }}>
          {section > 0 && (
            <button onClick={()=>{ setSection(s=>s-1); window.scrollTo(0,0); }}
              style={{ flex:1, background:"rgba(255,255,255,0.1)", border:"1px solid rgba(255,255,255,0.2)", color:"rgba(255,255,255,0.7)", padding:"14px", borderRadius:10, fontSize:14, fontFamily:F.b, cursor:"pointer" }}>
              ← Back
            </button>
          )}
          {section < SECTIONS.length - 1 ? (
            <button onClick={()=>{ setSection(s=>s+1); window.scrollTo(0,0); }}
              style={{ flex:2, background:C.amber, border:"none", color:"white", padding:"14px", borderRadius:10, fontSize:15, fontWeight:700, fontFamily:F.b, cursor:"pointer", boxShadow:"0 4px 16px rgba(200,112,26,0.35)" }}>
              Next: {SECTIONS[section+1].label} →
            </button>
          ) : (
            <button onClick={generate}
              style={{ flex:2, background:C.green, border:"none", color:"white", padding:"14px", borderRadius:10, fontSize:15, fontWeight:700, fontFamily:F.b, cursor:"pointer", boxShadow:"0 4px 16px rgba(30,107,69,0.35)" }}>
              Build My Snapshot →
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SnapshotApp />);
</script>
</body>
</html>
