// ── PORTAL ────────────────────────────────────────────────────────────────────
function Portal({ token, customer, onLogout }) {
  const [tab,setTab]=useState("progress");
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState("");
  const [generating,setGenerating]=useState(false);

  useEffect(()=>{
    api("portal-data","GET",null,token).then(r=>{
      setLoading(false);
      if (r.customer) {
        setData(r);
        // Auto-trigger plan generation if intake is complete but no plan yet
        if (r.customer.intake_complete && (!r.days || r.days.filter(d=>!d.locked&&!d.sprint).length === 0)) {
          setGenerating(true);
          api("generate-plan","POST",{},token).then(()=>{
            // Reload portal data after generation
            api("portal-data","GET",null,token).then(r2=>{
              if (r2.customer) setData(r2);
              setGenerating(false);
            });
          }).catch(()=>setGenerating(false));
        }
      } else if (r.error==="Unauthorized") onLogout();
    });
  },[]);

  function showToast(m){setToast(m);setTimeout(()=>setToast(""),3000);}

  async function saveProgress(completed){
    setSaving(true);
    const r=await api("portal-data","POST",{action:"save_progress",data:{completed}},token);
    setSaving(false);
    if(r.success){setData(p=>({...p,progress:{...p.progress,completed,last_updated:new Date().toISOString()}}));showToast("Progress saved!");}
  }

  async function saveNum(fieldId,value){
    const updated={...(data?.savedNumbers||{}),[fieldId]:value};
    setData(p=>({...p,savedNumbers:updated}));
    api("portal-data","POST",{action:"save_numbers",data:{numbers:updated}},token);
  }

  const fn=(customer?.name||"").split(" ")[0]||"there";
  const tabs=[{id:"progress",l:"📋 My Plan"},{id:"numbers",l:"📊 Numbers"},{id:"calc",l:"🧮 Calculators"},{id:"docs",l:"📁 Docs"},{id:"dashboard",l:"📈 My Progress"}];

  return (
    <div style={{minHeight:"100vh",background:C.warm0}}>
      {toast&&<div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",zIndex:999,background:C.green,color:"white",padding:"11px 22px",borderRadius:10,fontSize:13,fontFamily:F.b,fontWeight:600,boxShadow:"0 4px 20px rgba(0,0,0,0.2)"}}>{toast}</div>}
      <JenChat token={token} />
      <div style={{background:C.navy,padding:"0 20px",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:720,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:52}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <CompassLogo size={30} />
            <div style={{fontFamily:F.d,fontSize:13,fontWeight:800,color:C.white,letterSpacing:1}}>PROFIT LEAK FIXKIT</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <a href="mailto:support@compassbizsolutions.com?subject=FixKit Question" style={{background:"none",border:"none",color:"rgba(255,255,255,0.5)",padding:"5px 12px",borderRadius:6,fontSize:12,fontFamily:F.b,textDecoration:"none"}}>Contact Jen</a>
            <button onClick={onLogout} style={{background:"none",border:"1px solid rgba(255,255,255,0.2)",color:"rgba(255,255,255,0.5)",padding:"5px 12px",borderRadius:6,fontSize:12,fontFamily:F.b}}>Sign Out</button>
          </div>
        </div>
      </div>
      <div style={{background:"linear-gradient(135deg,"+C.navyDark+","+C.navyLight+")",padding:"16px 20px"}}>
        <div style={{maxWidth:720,margin:"0 auto"}}>
          <div style={{fontFamily:F.d,fontSize:20,fontWeight:800,color:C.white,letterSpacing:1}}>
            {fn} — {customer?.biz||""} <span style={{color:C.amber}}>{data?.customer?.is_bundle?"· 30/60/90":"· 30-Day"}</span>
          </div>
          {data?.progress?.last_updated&&<div style={{fontFamily:F.b,fontSize:11,color:"rgba(255,255,255,0.35)",marginTop:3}}>Last updated: {new Date(data.progress.last_updated).toLocaleDateString()}</div>}
        </div>
      </div>
      <div style={{background:C.white,borderBottom:"1px solid "+C.warm3,padding:"0 20px"}}>
        <div style={{maxWidth:720,margin:"0 auto",display:"flex",overflowX:"auto"}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"13px 14px",background:"none",border:"none",borderBottom:"3px solid "+(tab===t.id?C.amber:"transparent"),color:tab===t.id?C.amber:C.muted,fontFamily:F.b,fontSize:13,fontWeight:tab===t.id?700:500,cursor:"pointer",whiteSpace:"nowrap"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>
      <div style={{maxWidth:720,margin:"0 auto",padding:"20px 20px 80px"}}>
        {loading?<div style={{textAlign:"center",padding:60,color:C.muted,fontFamily:F.b}}>Loading your portal...</div>:generating?<div style={{textAlign:"center",padding:60}}>
          <div style={{fontFamily:F.d,fontSize:20,fontWeight:800,color:C.navy,marginBottom:12}}>BUILDING YOUR PLAN</div>
          <div style={{fontFamily:F.b,fontSize:14,color:C.muted,marginBottom:24}}>Analyzing your intake answers and building your personalized 90-day plan. This takes about 30 seconds.</div>
          <div style={{width:48,height:48,border:"4px solid "+C.warm3,borderTop:"4px solid "+C.amber,borderRadius:"50%",margin:"0 auto",animation:"spin 1s linear infinite"}}/>
          <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
        </div>:(
          <>
            {tab==="progress"&&<ProgressTracker days={data?.days||[]} progress={data?.progress} onSave={saveProgress} onSaveNum={saveNum} saving={saving} isBundle={data?.customer?.is_bundle} numbers={data?.savedNumbers||{}} intakeAnswers={data?.customer?.intake_answers||{}} readyDocs={data?.customer?.ready_docs||[]} eh={data?.eh||""} siteUrl={data?.siteUrl||""} onSwitchTab={setTab} />}
            {tab==="numbers"&&<NumbersSummary numbers={data?.savedNumbers||{}} intakeAnswers={data?.customer?.intake_answers||{}} />}
            {tab==="calc"&&<Calculators numbers={data?.savedNumbers||{}} onSaveNum={saveNum} intakeAnswers={data?.customer?.intake_answers||{}} />}
            {tab==="docs"&&<Docs availableDocs={data?.availableDocs||[]} eh={data?.eh||""} siteUrl={data?.siteUrl||""} completed={data?.progress?.completed||[]} token={token} readyDocs={data?.customer?.ready_docs||[]} />}
            {tab==="dashboard"&&<CustomerDashboard data={data} />}
          </>
        )}
      </div>
    </div>
  );
}

// ── JEN CHAT BUBBLE ───────────────────────────────────────────────────────────
function JenChat({ token }) {
  const [open, setOpen] = useState(false);
  const [dismissed, setDismissed] = useState(() => localStorage.getItem("jen_chat_dismissed") === "1");
  const [messages, setMessages] = useState([
    { role: "assistant", content: "Hey — I'm Jen. Ask me anything about your plan, your numbers, or how to fix a leak in your business. I'm here." }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = React.useRef(null);

  useEffect(() => {
    if (open && bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "smooth" });
  }, [messages, open]);

  function dismiss() {
    setDismissed(true);
    setOpen(false);
    localStorage.setItem("jen_chat_dismissed", "1");
  }

  async function send() {
    if (!input.trim() || loading) return;
    const userMsg = input.trim();
    setInput("");
    const history = messages.slice(1); // exclude opening greeting from history
    setMessages(prev => [...prev, { role: "user", content: userMsg }]);
    setLoading(true);

    try {
      const r = await api("ask-jen", "POST", { message: userMsg, history }, token);
      setMessages(prev => [...prev, { role: "assistant", content: r.reply || "Something went wrong. Try again." }]);
    } catch(e) {
      setMessages(prev => [...prev, { role: "assistant", content: "Having trouble connecting. Try again in a moment." }]);
    }
    setLoading(false);
  }

  // Show hint tooltip if not dismissed and not open
  if (dismissed && !open) return null;

  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, zIndex: 500 }}>

      {/* Hint badge — shown once until they open or dismiss */}
      {!open && !dismissed && (
        <div style={{ position: "absolute", bottom: 56, right: 0, background: C.navy, borderRadius: "10px 10px 0 10px", padding: "10px 14px", width: 220, boxShadow: "0 4px 20px rgba(0,0,0,0.2)", marginBottom: 4 }}>
          <div style={{ fontFamily: F.b, fontSize: 12, color: "white", lineHeight: 1.5, marginBottom: 8 }}>
            Have a question? I'm Jen — ask me anything about your plan.
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setOpen(true)} style={{ flex: 1, background: C.amber, border: "none", color: "white", padding: "7px", borderRadius: 6, fontSize: 12, fontWeight: 700, fontFamily: F.b, cursor: "pointer" }}>
              Ask Jen
            </button>
            <button onClick={dismiss} style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "rgba(255,255,255,0.5)", padding: "7px 10px", borderRadius: 6, fontSize: 12, fontFamily: F.b, cursor: "pointer" }}>
              Dismiss
            </button>
          </div>
        </div>
      )}

      {/* Chat window */}
      {open && (
        <div style={{ position: "absolute", bottom: 56, right: 0, width: 320, maxWidth: "calc(100vw - 40px)", background: C.white, borderRadius: 16, boxShadow: "0 8px 40px rgba(0,0,0,0.2)", overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {/* Header */}
          <div style={{ background: C.navy, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <CompassLogo size={28} />
              <div>
                <div style={{ fontFamily: F.d, fontSize: 14, fontWeight: 800, color: C.white, letterSpacing: 1 }}>ASK JEN</div>
                <div style={{ fontFamily: F.b, fontSize: 10, color: "rgba(255,255,255,0.4)" }}>Compass Business Solutions</div>
              </div>
            </div>
            <button onClick={() => setOpen(false)} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.4)", fontSize: 20, cursor: "pointer", lineHeight: 1, padding: 4 }}>×</button>
          </div>

          {/* Messages */}
          <div style={{ flex: 1, overflowY: "auto", padding: "14px 14px 6px", maxHeight: 320, display: "flex", flexDirection: "column", gap: 10 }}>
            {messages.map((m, i) => (
              <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
                <div style={{
                  maxWidth: "85%", padding: "9px 12px", borderRadius: m.role === "user" ? "12px 12px 2px 12px" : "12px 12px 12px 2px",
                  background: m.role === "user" ? C.amber : C.warm1,
                  fontFamily: F.b, fontSize: 13, color: m.role === "user" ? "white" : C.body, lineHeight: 1.55,
                }}>
                  {m.content}
                </div>
              </div>
            ))}
            {loading && (
              <div style={{ display: "flex", justifyContent: "flex-start" }}>
                <div style={{ background: C.warm1, borderRadius: "12px 12px 12px 2px", padding: "9px 14px" }}>
                  <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                    {[0,1,2].map(i => (
                      <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: C.muted, animation: "none", opacity: 0.4 + i * 0.2 }} />
                    ))}
                  </div>
                </div>
              </div>
            )}
            <div ref={bottomRef} />
          </div>

          {/* Input */}
          <div style={{ padding: "10px 12px", borderTop: "1px solid " + C.warm2, display: "flex", gap: 8 }}>
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && !e.shiftKey && send()}
              placeholder="Ask anything..."
              style={{ flex: 1, padding: "9px 12px", border: "1px solid " + C.warm3, borderRadius: 8, fontSize: 13, fontFamily: F.b, color: C.ink, outline: "none", background: C.warm0 }}
            />
            <button onClick={send} disabled={loading || !input.trim()}
              style={{ background: C.amber, border: "none", color: "white", padding: "9px 14px", borderRadius: 8, fontSize: 13, fontWeight: 700, fontFamily: F.b, opacity: (!input.trim() || loading) ? 0.5 : 1, cursor: !input.trim() || loading ? "default" : "pointer" }}>
              →
            </button>
          </div>

          {/* Disclaimer */}
          <div style={{ padding: "6px 12px 10px", fontFamily: F.b, fontSize: 10, color: C.ghost, lineHeight: 1.4, textAlign: "center" }}>
            Operational advice only — not tax, legal, or investment advice
          </div>
        </div>
      )}

      {/* Bubble button */}
      <button onClick={() => setOpen(o => !o)}
        style={{ width: 44, height: 44, borderRadius: "50%", background: open ? C.navy : C.amber, border: "none", color: "white", fontSize: open ? 20 : 18, cursor: "pointer", boxShadow: "0 4px 16px rgba(0,0,0,0.2)", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s" }}>
        {open ? "×" : "?"}
      </button>
    </div>
  );
}

      </div>
      <input value={vals[id]||""} onChange={e=>setVal(id, e.target.value)} placeholder={ph||""}
        style={{ width:"100%", padding:"11px 14px", border:"2px solid "+C.warm3, borderRadius:8, fontSize:14, fontFamily:F.b, color:C.ink, outline:"none", boxSizing:"border-box" }} />
    </div>
  );
}

function IntakeNumberField({ id, label, ph, vals, setVal, help, prefix, suffix }) {
  return (
    <div style={{ marginBottom:20 }}>
      <div style={{ display:"flex", alignItems:"flex-start", gap:6, marginBottom:10 }}>
        <div style={{ fontFamily:F.b, fontSize:14, fontWeight:600, color:C.ink, lineHeight:1.4, flex:1 }}>{label}</div>
        {help && <Tip text={help} />}
      </div>
      <div style={{ display:"flex", alignItems:"center", border:"2px solid "+C.warm3, borderRadius:8, overflow:"hidden", maxWidth:220 }}>
        {prefix && <span style={{ padding:"11px 10px 11px 14px", fontFamily:F.b, fontSize:14, color:C.muted, background:C.warm2, borderRight:"1px solid "+C.warm3 }}>{prefix}</span>}
        <input type="number" min="0" value={vals[id]||""} onChange={e=>setVal(id, e.target.value)} placeholder={ph||""}
          style={{ flex:1, padding:"11px 10px", border:"none", fontSize:14, fontFamily:F.b, color:C.ink, outline:"none", background:"white", minWidth:0 }} />
        {suffix && <span style={{ padding:"11px 14px 11px 10px", fontFamily:F.b, fontSize:13, color:C.muted, background:C.warm2, borderLeft:"1px solid "+C.warm3, whiteSpace:"nowrap" }}>{suffix}</span>}
      </div>
    </div>
  );
}

function IntakeTextArea({ id, label, ph, vals, setVal, help }) {
  return (
    <div style={{ marginBottom:20 }}>
      <div style={{ display:"flex", alignItems:"flex-start", gap:6, marginBottom:10 }}>
        <div style={{ fontFamily:F.b, fontSize:14, fontWeight:600, color:C.ink, lineHeight:1.4, flex:1 }}>{label}</div>
        {help && <Tip text={help} />}
      </div>
      <textarea value={vals[id]||""} onChange={e=>setVal(id, e.target.value)} placeholder={ph||""} rows={3}
        style={{ width:"100%", padding:"11px 14px", border:"2px solid "+C.warm3, borderRadius:8, fontSize:14, fontFamily:F.b, color:C.ink, outline:"none", boxSizing:"border-box", resize:"vertical" }} />
    </div>
  );
}
function IntakeBtn({ id, v, multi, vals, multiVals, setVal, toggleMulti }) {
  const active = multi ? (multiVals[id]||[]).includes(v) : vals[id]===v;
  return (
    <button onClick={()=>multi?toggleMulti(id,v):setVal(id,v)}
      style={{ padding:"9px 14px", borderRadius:8, border:"2px solid "+(active?C.amber:C.warm3), background:active?C.amberLight:C.white, color:active?C.amber:C.body, fontSize:13, fontWeight:active?700:500, fontFamily:F.b, cursor:"pointer", margin:"0 6px 6px 0", transition:"all 0.15s" }}>
      {v}
    </button>
  );
}

function Q({ id, label, type, opts, ph, multi, help, prefix, suffix, vals, multiVals, setVal, toggleMulti }) {
  if (type==="text") return <IntakeTextField id={id} label={label} ph={ph} help={help} vals={vals} setVal={setVal} />;
  if (type==="number") return <IntakeNumberField id={id} label={label} ph={ph} help={help} prefix={prefix} suffix={suffix} vals={vals} setVal={setVal} />;
  if (type==="textarea") return <IntakeTextArea id={id} label={label} ph={ph} help={help} vals={vals} setVal={setVal} />;
  return (
    <div style={{ marginBottom:20 }}>
      <div style={{ display:"flex", alignItems:"flex-start", marginBottom:10, gap:6 }}>
        <div style={{ fontFamily:F.b, fontSize:14, fontWeight:600, color:C.ink, lineHeight:1.4, flex:1 }}>{label}</div>
        {help && <Tip text={help} />}
      </div>
      <div style={{ display:"flex", flexWrap:"wrap" }}>
        {(opts||[]).map(o=><IntakeBtn key={o} id={id} v={o} multi={type==="multi"||multi} vals={vals} multiVals={multiVals} setVal={setVal} toggleMulti={toggleMulti} />)}
      </div>
    </div>
  );
}

function IntakeOnboarding({ token, customer, onComplete }) {
  const [section, setSection] = useState(0); // 0=welcome, 1-11=sections, 12=generating
  const [vals, setVals] = useState({});
  const [multiVals, setMultiVals] = useState({});
  const [err, setErr] = useState("");

  // Pre-fill from customer record if available
  const [name, setName] = useState(customer.name || "");
  const [biz, setBiz] = useState(customer.biz || "");
  const [phone, setPhone] = useState(customer.phone || "");
  const [address, setAddress] = useState(customer.address || "");
  const [trade, setTrade] = useState(customer.trade || "");

  // Compute which fields need to be shown ONCE at mount — never change based on current value
  const needsName = !customer.name;
  const needsBiz = !customer.biz;
  const needsTrade = !customer.trade;

  const isBundle = customer.plan_type === "bundle" || customer.plan_type === "599";
  const isSnapshot = customer.plan_type === "snapshot";
  const firstName = name.split(" ")[0] || "there";
  const pct = section === 0 ? 0 : section >= 11 ? 95 : Math.round((section / 11) * 100);

  function setVal(id, v) { setVals(p => ({ ...p, [id]: v })); }
  function toggleMulti(id, v) {
    setMultiVals(p => {
      const cur = p[id] || [];
      return { ...p, [id]: cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v] };
    });
  }

  const sections = INTAKE_SECTIONS;

  async function generatePlan() {
    setSection(12);
    setErr("");
    try {
      const res = await api("generate-plan", "POST", {
        vals, multiVals, name, biz, address, trade, phone
      }, token);
      if (res.success) onComplete();
      else setErr(res.error || "Something went wrong. Please try again.");
    } catch(e) {
      setErr("Connection error. Please try again.");
      setSection(11);
    }
  }

  // Welcome screen
  if (section === 0) return (
    <div style={{ minHeight:"100vh", background:C.navy, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ width:"100%", maxWidth:520 }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <CompassLogo size={60} />
          <div style={{ fontFamily:F.d, fontSize:28, fontWeight:800, color:C.white, letterSpacing:2 }}>{isSnapshot?"LET'S BUILD YOUR SNAPSHOT":"LET'S BUILD YOUR PLAN"}</div>
          <div style={{ fontFamily:F.b, fontSize:13, color:"rgba(255,255,255,0.4)", marginTop:6 }}>{isSnapshot ? "DIY Profit Leak Snapshot" : isBundle ? "Complete 30/60/90-Day Plan" : "30-Day Quick Win Plan"}</div>
        </div>
        <div style={{ background:C.white, borderRadius:16, padding:"28px 24px", boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>
          <p style={{ fontFamily:F.b, fontSize:14, color:C.body, lineHeight:1.7, marginBottom:20 }}>
            Hi {firstName} — before we build your plan, we need to understand how your business actually runs. This takes about 15 minutes. The more specific you are, the more precise your plan will be.
          </p>
          <div style={{ background:C.warm1, borderRadius:10, padding:"14px 16px", marginBottom:20 }}>
            <div style={{ fontFamily:F.b, fontSize:12, color:C.muted, lineHeight:1.65 }}>
              We cover 11 areas: Pricing · Scheduling · Employee Cost · Recurring Revenue · Estimate-to-Invoice · Cash Flow · Customer Churn · Materials Markup · Admin Drain · Vehicles & Parts · Safety
            </div>
          </div>
          {/* Show fields that weren't pre-filled — visibility based on mount-time check, not live state */}
          {(needsName || needsBiz || needsTrade) && (
            <div style={{ marginBottom:20 }}>
              {needsName && <IntakeSimpleInput value={name} onChange={setName} placeholder="Your first and last name" />}
              {needsBiz && <IntakeSimpleInput value={biz} onChange={setBiz} placeholder="Business name" />}
              {needsTrade && (
                <div>
                  <div style={{ fontFamily:F.b,fontSize:13,fontWeight:600,color:C.body,marginBottom:8 }}>What trade are you in?</div>
                  <div style={{ display:"flex",flexWrap:"wrap",gap:6 }}>
                    {["Air Duct Cleaning","Appliance Repair","Carpet Cleaning","Chimney and Fireplace","Cleaning Services","Electrical","Flooring","Garage Door","General Contracting","Gutters","HVAC","Handyman","Irrigation","Landscaping","Locksmith","Painting","Pest Control","Plumbing","Pool & Spa","Pressure Washing","Restoration and Remediation","Roofing","Security Systems","Solar","Tile and Stone","Tree Service","Other"].map(t=>(
                      <button key={t} onClick={()=>setTrade(t)}
                        style={{ padding:"8px 12px",borderRadius:8,border:"2px solid "+(trade===t?C.amber:C.warm3),background:trade===t?C.amberLight:C.white,color:trade===t?C.amber:C.body,fontSize:12,fontWeight:trade===t?700:500,fontFamily:F.b,cursor:"pointer" }}>
                        {t}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
          <button onClick={() => setSection(1)} style={{ width:"100%",background:C.amber,border:"none",color:"white",padding:"14px",borderRadius:10,fontSize:15,fontWeight:700,fontFamily:F.b,cursor:"pointer" }}>
            Let's Go — Start My Intake →
          </button>
        </div>
      </div>
    </div>
  );

  // Generating screen
  if (section === 12) return (
    <div style={{ minHeight:"100vh", background:C.navy, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ textAlign:"center", maxWidth:400 }}>
        <CompassLogo size={60} />
        <div style={{ fontFamily:F.d, fontSize:28, fontWeight:800, color:C.white, letterSpacing:2, marginBottom:12 }}>{isSnapshot?"BUILDING YOUR SNAPSHOT":"BUILDING YOUR PLAN"}</div>
        <p style={{ fontFamily:F.b, fontSize:14, color:"rgba(255,255,255,0.5)", lineHeight:1.7, marginBottom:20 }}>
          {isSnapshot ? "Analyzing your answers and identifying your top profit leaks — with the math and exactly how to fix them." : `We're analyzing your answers and building your customized ${isBundle?"30/60/90-day":"30-day"} plan.`} This takes about 30 seconds.
        </p>
        {/* Animated dots */}
        <div style={{ display:"flex", justifyContent:"center", gap:8 }}>
          {[0,1,2].map(i=>(
            <div key={i} style={{ width:10,height:10,borderRadius:"50%",background:C.amber,opacity:0.3+(i*0.35) }} />
          ))}
        </div>
        {err && (
          <div style={{ marginTop:20, background:"rgba(184,76,46,0.2)", borderRadius:8, padding:"12px 16px" }}>
            <p style={{ fontFamily:F.b,fontSize:13,color:"#ffaaaa",margin:"0 0 10px" }}>{err}</p>
            <button onClick={generatePlan} style={{ background:C.amber,border:"none",color:"white",padding:"10px 20px",borderRadius:8,fontSize:13,fontWeight:700,fontFamily:F.b,cursor:"pointer" }}>Try Again</button>
          </div>
        )}
      </div>
    </div>
  );

  // Section screens
  const sec = sections[section - 1];
  return (
    <div style={{ minHeight:"100vh", background:C.warm0 }}>
      {/* Header */}
      <div style={{ background:C.navy, padding:"0 20px", position:"sticky", top:0, zIndex:100 }}>
        <div style={{ maxWidth:600, margin:"0 auto", display:"flex", alignItems:"center", height:52, gap:12 }}>
          <CompassLogo size={28} />
          <div style={{ fontFamily:F.d,fontSize:13,fontWeight:800,color:C.white,letterSpacing:1,flex:1 }}>PROFIT LEAK FIXKIT</div>
          <div style={{ fontFamily:F.b,fontSize:11,color:"rgba(255,255,255,0.4)" }}>Section {section} of 11</div>
        </div>
      </div>

      {/* Progress bar */}
      <div style={{ background:C.warm2, height:4 }}>
        <div style={{ width:pct+"%", height:"100%", background:C.amber, transition:"width 0.4s" }} />
      </div>

      <div style={{ maxWidth:600, margin:"0 auto", padding:"24px 20px 80px" }}>
        {/* Section header */}
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:24 }}>
          <div style={{ width:36,height:36,borderRadius:"50%",background:sec.color,display:"flex",alignItems:"center",justifyContent:"center" }}>
            <span style={{ fontFamily:F.b,fontSize:13,fontWeight:700,color:"white" }}>{String(section).padStart(2,"0")}</span>
          </div>
          <div style={{ fontFamily:F.d,fontSize:22,fontWeight:800,color:sec.color,letterSpacing:1 }}>{sec.label}</div>
        </div>

        {/* Questions */}
        {sec.questions.map(q => <Q key={q.id} {...q} vals={vals} multiVals={multiVals} setVal={setVal} toggleMulti={toggleMulti} />)}

        {/* Navigation */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
          <button onClick={()=>setSection(s=>Math.max(0,s-1))}
            style={{ background:"none",border:"none",color:C.muted,fontSize:13,fontFamily:F.b,cursor:"pointer",padding:"10px 0" }}>
            ← Back
          </button>
          {section < 11 ? (
            <button onClick={()=>setSection(s=>s+1)}
              style={{ background:sec.color,border:"none",color:"white",padding:"12px 28px",borderRadius:10,fontSize:14,fontWeight:700,fontFamily:F.b,cursor:"pointer" }}>
              Next →
            </button>
          ) : (
            <button onClick={generatePlan}
              style={{ background:C.green,border:"none",color:"white",padding:"13px 28px",borderRadius:10,fontSize:14,fontWeight:700,fontFamily:F.b,cursor:"pointer" }}>
              Build My Plan →
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [token,setToken]=useState(()=>localStorage.getItem("fixkit_token")||"");
  const [customer,setCustomer]=useState(()=>{try{return JSON.parse(localStorage.getItem("fixkit_customer")||"null");}catch(e){return null;}});
  const [intakeComplete,setIntakeComplete]=useState(null); // null = still checking
  const [checking,setChecking]=useState(true);

  // Always verify intake status from server on load — never trust localStorage alone
  useEffect(()=>{
    if (!token) { setChecking(false); return; }
    api("portal-data","GET",null,token).then(r=>{
      if (r.error === "Unauthorized") {
        localStorage.removeItem("fixkit_token");
        localStorage.removeItem("fixkit_customer");
        setToken(""); setCustomer(null); setIntakeComplete(false);
      } else if (r.customer) {
        const updated = Object.assign({}, customer||{}, r.customer);
        localStorage.setItem("fixkit_customer", JSON.stringify(updated));
        setCustomer(updated);
        // If upgraded from snapshot with intake done but no plan yet — trigger plan generation
        if (r.customer.intake_complete && r.customer.upgraded_from_snapshot && !r.days?.length) {
          setIntakeComplete(false); // re-run through generate-plan
        } else {
          setIntakeComplete(r.customer.intake_complete || false);
        }
      }
      setChecking(false);
    }).catch(()=>{ setChecking(false); setIntakeComplete(customer?.intake_complete||false); });
  },[token]);

  function login(t,c){
    localStorage.setItem("fixkit_token",t);
    localStorage.setItem("fixkit_customer",JSON.stringify(c));
    setToken(t); setCustomer(c);
    setIntakeComplete(null); // will be set by useEffect
    setChecking(true);
  }

  function logout(){
    localStorage.removeItem("fixkit_token");
    localStorage.removeItem("fixkit_customer");
    setToken(""); setCustomer(null); setIntakeComplete(false); setChecking(false);
  }

  function handleIntakeComplete(){
    const updated = Object.assign({},customer,{intake_complete:true});
    localStorage.setItem("fixkit_customer",JSON.stringify(updated));
    setCustomer(updated);
    setIntakeComplete(true);
  }

  if (!token||!customer) return <Login onLogin={login} />;
  if (checking || intakeComplete === null) return (
    <div style={{minHeight:"100vh",background:C.navy,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <CompassLogo size={60} />
        <div style={{fontFamily:F.b,fontSize:13,color:"rgba(255,255,255,0.4)"}}>Loading your account...</div>
      </div>
    </div>
  );
  if (!intakeComplete) return <IntakeOnboarding token={token} customer={customer} onComplete={handleIntakeComplete} />;
  // Snapshot customers get stripped-down results view
  const isSnapshot = customer?.plan_type === "snapshot";
  if (isSnapshot) return <SnapshotPortal token={token} customer={customer} onLogout={logout} />;
  return <Portal token={token} customer={customer} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
