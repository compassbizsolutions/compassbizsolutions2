<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #111E31; color: #F7F5F2; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1B2E4B; } ::-webkit-scrollbar-thumb { background: #3D6B9E; border-radius: 3px; }
    input, textarea { font-family: 'DM Sans', sans-serif; }
    button { font-family: 'DM Sans', sans-serif; cursor: pointer; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  navy:"#1B2E4B", navyDark:"#111E31", navyLight:"#243A5E",
  amber:"#C8701A", amberLight:"#FDF3E7",
  red:"#B84C2E", green:"#1E6B45", greenLight:"#E8F5EE",
  slate:"#3D6B9E", gold:"#A8782A",
  warm0:"#F7F5F2", warm1:"#F0EFED", warm2:"#E8E4DC", warm3:"#D8D4CD",
  white:"#FFFFFF", ink:"#1A2332", body:"#3E4E63", muted:"#6B7A90", ghost:"#A0ABBE",
  panel:"#1B2E4B", panelLight:"#243A5E",
};
const F = { d:"'Barlow Condensed', sans-serif", b:"'DM Sans', sans-serif" };

const PLAN_PRICES = { "snapshot":99, "30day":299, "60day":299, "90day":299, "bundle":599 };
const PLAN_LABELS = { "snapshot":"Snapshot", "30day":"30-Day", "60day":"60-Day", "90day":"90-Day", "bundle":"Bundle" };
const PLAN_COLORS = { "snapshot":C.slate, "30day":C.amber, "60day":C.slate, "90day":C.gold, "bundle":C.red };

const GOALS = [
  { label:"$10K/mo", target:10000, date:"Jun 1, 2026", color:C.amber, note:"Pre-app launch" },
  { label:"$15K/mo", target:15000, date:"Aug 31, 2026", color:"#E67E22", note:"Summer momentum" },
  { label:"$20K/mo", target:20000, date:"Sep 30, 2026", color:C.red, note:"App live + FixKit" },
  { label:"$25K/mo", target:25000, date:"Dec 31, 2026", color:"#7F77DD", note:"Year-end target" },
];

async function apiCall(path, body) {
  const r = await fetch("/api/" + path, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  return r.json();
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function Login({ onLogin }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  async function login() {
    if (!pw) return;
    setLoading(true); setErr("");
    const r = await apiCall("admin-auth", { password: pw });
    setLoading(false);
    if (r.success) onLogin(r.token);
    else setErr("Incorrect password.");
  }

  return (
    <div style={{ minHeight:"100vh", background:C.navyDark, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ width:"100%", maxWidth:380 }}>
        <div style={{ textAlign:"center", marginBottom:32 }}>
          <div style={{ fontFamily:F.d, fontSize:12, fontWeight:700, color:C.amber, letterSpacing:4, marginBottom:8 }}>COMPASS BUSINESS SOLUTIONS</div>
          <div style={{ fontFamily:F.d, fontSize:36, fontWeight:800, color:C.white, letterSpacing:2 }}>ADMIN</div>
        </div>
        <div style={{ background:C.panel, borderRadius:14, padding:"28px 24px", boxShadow:"0 20px 60px rgba(0,0,0,0.4)" }}>
          <input value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()}
            type="password" placeholder="Password" autoFocus
            style={{ width:"100%", padding:"13px 16px", background:C.navyDark, border:"2px solid "+(err?C.red:C.panelLight), borderRadius:10, fontSize:15, color:C.white, outline:"none", fontFamily:F.b, boxSizing:"border-box", marginBottom:12 }} />
          {err && <div style={{ color:C.red, fontSize:12, fontFamily:F.b, marginBottom:10 }}>{err}</div>}
          <button onClick={login} disabled={loading}
            style={{ width:"100%", background:C.amber, border:"none", color:"white", padding:"13px", borderRadius:10, fontSize:15, fontWeight:700, fontFamily:F.b, opacity:loading?.7:1 }}>
            {loading ? "Signing in..." : "Enter →"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── STAT CARD ─────────────────────────────────────────────────────────────────
function StatCard({ label, value, sub, color, big }) {
  return (
    <div style={{ background:C.panel, borderRadius:12, padding:"18px 20px", border:"1px solid "+C.panelLight }}>
      <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:8 }}>{label}</div>
      <div style={{ fontFamily:F.d, fontSize:big?42:32, fontWeight:800, color:color||C.amber, lineHeight:1 }}>{value}</div>
      {sub && <div style={{ fontFamily:F.b, fontSize:12, color:C.muted, marginTop:6 }}>{sub}</div>}
    </div>
  );
}

// ── GOAL BAR ──────────────────────────────────────────────────────────────────
function GoalBar({ current, goal }) {
  const pct = Math.min(100, Math.round((current / goal.target) * 100));
  const remaining = Math.max(0, goal.target - current);
  const barColor = pct >= 100 ? C.green : goal.color || C.amber;
  return (
    <div style={{ background:C.panel, borderRadius:12, padding:"18px 20px", border:"1px solid "+C.panelLight, marginBottom:12 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
        <div>
          <div style={{ fontFamily:F.d, fontSize:20, fontWeight:800, color:goal.color||C.white }}>{goal.label}</div>
          <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>Target by {goal.date}</div>
          {goal.note && <div style={{ fontFamily:F.b, fontSize:11, color:goal.color||C.muted, marginTop:2, opacity:0.8 }}>{goal.note}</div>}
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontFamily:F.d, fontSize:28, fontWeight:800, color:pct>=100?C.green:C.white }}>{pct}%</div>
          {remaining > 0 && <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>${remaining.toLocaleString()} to go</div>}
          {pct >= 100 && <div style={{ fontFamily:F.b, fontSize:11, color:C.green }}>✓ Achieved</div>}
        </div>
      </div>
      <div style={{ background:C.navyDark, borderRadius:99, height:10, overflow:"hidden" }}>
        <div style={{ width:pct+"%", height:"100%", background:barColor, borderRadius:99, transition:"width 0.8s" }} />
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", marginTop:6 }}>
        <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>${current.toLocaleString()}/mo current</div>
        <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>${goal.target.toLocaleString()}/mo goal</div>
      </div>
    </div>
  );
}

// ── REVENUE CHART ─────────────────────────────────────────────────────────────
function RevenueChart({ customers }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !customers.length) return;
    if (chartRef.current) chartRef.current.destroy();

    // Group revenue by month
    const months = {};
    customers.forEach(c => {
      const d = new Date(c.phase_1_date || c.updated || Date.now());
      const key = d.toLocaleString("default", { month:"short", year:"2-digit" });
      const rev = PLAN_PRICES[c.plan_type] || 0;
      months[key] = (months[key] || 0) + rev;
    });

    const labels = Object.keys(months).slice(-6);
    const data = labels.map(l => months[l]);

    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "Revenue",
          data,
          backgroundColor: C.amber + "CC",
          borderColor: C.amber,
          borderWidth: 2,
          borderRadius: 6,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => "$" + ctx.raw.toLocaleString() } }
        },
        scales: {
          x: { grid: { color: C.panelLight }, ticks: { color: C.muted, font: { family: "DM Sans" } } },
          y: { grid: { color: C.panelLight }, ticks: { color: C.muted, font: { family: "DM Sans" }, callback: v => "$" + v.toLocaleString() } }
        }
      }
    });
  }, [customers]);

  return (
    <div style={{ background:C.panel, borderRadius:12, padding:"18px 20px", border:"1px solid "+C.panelLight }}>
      <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:16 }}>REVENUE BY MONTH</div>
      <div style={{ height:180 }}>
        <canvas ref={canvasRef} />
      </div>
    </div>
  );
}

// ── LEADS TABLE ───────────────────────────────────────────────────────────────
function LeadsTable({ leads, customers }) {
  const [search, setSearch] = useState("");
  const customerEmails = new Set(customers.map(c => c.email?.toLowerCase()));

  const filtered = leads.filter(l =>
    !search || l.email?.toLowerCase().includes(search.toLowerCase()) ||
    l.biz?.toLowerCase().includes(search.toLowerCase()) ||
    l.trade?.toLowerCase().includes(search.toLowerCase())
  );

  const converted = leads.filter(l => customerEmails.has(l.email?.toLowerCase())).length;
  const convRate = leads.length ? Math.round((converted / leads.length) * 100) : 0;

  return (
    <div style={{ background:C.panel, borderRadius:12, border:"1px solid "+C.panelLight, overflow:"hidden" }}>
      <div style={{ padding:"16px 20px", borderBottom:"1px solid "+C.panelLight, display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
        <div>
          <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:4 }}>DIAGNOSTIC LEADS</div>
          <div style={{ display:"flex", gap:16 }}>
            <span style={{ fontFamily:F.b, fontSize:12, color:C.ghost }}>{leads.length} total</span>
            <span style={{ fontFamily:F.b, fontSize:12, color:C.green }}>{converted} converted</span>
            <span style={{ fontFamily:F.b, fontSize:12, color:C.amber }}>{convRate}% conversion</span>
          </div>
        </div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search leads..."
          style={{ padding:"8px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:8, fontSize:13, color:C.white, outline:"none", fontFamily:F.b, width:200 }} />
      </div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse" }}>
          <thead>
            <tr style={{ background:C.navyDark }}>
              {["Email","Business","Trade","Top Leak","Status","Date"].map(h => (
                <th key={h} style={{ padding:"10px 16px", textAlign:"left", fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1, whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.slice(0, 50).map((l, i) => {
              const isCustomer = customerEmails.has(l.email?.toLowerCase());
              return (
                <tr key={i} style={{ borderTop:"1px solid "+C.panelLight, background:i%2===0?"transparent":C.navyDark+"44" }}>
                  <td style={{ padding:"10px 16px", fontFamily:F.b, fontSize:12, color:C.white }}>{l.email || "—"}</td>
                  <td style={{ padding:"10px 16px", fontFamily:F.b, fontSize:12, color:C.ghost }}>{l.biz || "—"}</td>
                  <td style={{ padding:"10px 16px", fontFamily:F.b, fontSize:12, color:C.ghost }}>{l.trade || "—"}</td>
                  <td style={{ padding:"10px 16px", fontFamily:F.b, fontSize:12, color:C.amber }}>{l.top_leak || "—"}</td>
                  <td style={{ padding:"10px 16px" }}>
                    <span style={{ background:isCustomer?C.green+"33":C.amber+"22", color:isCustomer?C.green:C.amber, border:"1px solid "+(isCustomer?C.green+"44":C.amber+"44"), borderRadius:99, padding:"2px 10px", fontSize:10, fontWeight:700, fontFamily:F.b }}>
                      {isCustomer ? "CUSTOMER" : "LEAD"}
                    </span>
                  </td>
                  <td style={{ padding:"10px 16px", fontFamily:F.b, fontSize:11, color:C.ghost, whiteSpace:"nowrap" }}>
                    {l.created_at ? new Date(l.created_at).toLocaleDateString() : "—"}
                  </td>
                </tr>
              );
            })}
            {filtered.length === 0 && (
              <tr><td colSpan={6} style={{ padding:"24px", textAlign:"center", fontFamily:F.b, fontSize:13, color:C.muted }}>No leads found</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── CUSTOMERS TABLE ───────────────────────────────────────────────────────────
function getTag(text, tag) {
  const m = (text||"").match(new RegExp("\\[" + tag + "\\]([\\s\\S]*?)(?=\\n\\[[A-Z][A-Z_0-9]+\\]|$)"));
  return m ? m[1].trim() : "";
}

const INTAKE_LABELS = {
  p1_rate:"Hourly rate / flat fee", p2_basis:"Rate based on", p3_loaded:"Knows loaded cost", p4_rates_increase:"Last rate increase",
  e2_loaded_cost:"Est. loaded cost/hr", s1_lead_time:"Booking lead time", s5_noshows:"No-shows/cancels per week",
  jobs:"Jobs per week", invoice:"Average job value", crew:"Field techs", e3_time_track:"Time tracking method",
  e7_attendance:"Attendance issues", r1_agreements:"Maintenance agreements", r2_agreement_detail:"Agreement details",
  r3_predictable:"Predictable monthly revenue %", i1_close:"Close rate on estimates", i3_change_order:"Change order process",
  i4_invoice:"Invoice timing", c1_breakeven_know:"Knows break-even", c2_breakeven:"Monthly break-even",
  c3_ar:"Days outstanding on AR", ch1_followup:"Post-job follow-up", ch4_reviews:"Google reviews",
  ch6_referral:"Referral program", m1_markup:"Parts/materials markup", m2_consistency:"Markup consistency",
  mat_weekly_spend:"Weekly materials spend", a1_hours:"Admin hours/week", a6_drain:"Biggest admin drain",
  v1_runs:"Unplanned parts runs/week", trucks:"Trucks/vehicles", v5_monthly_cost:"Monthly cost per truck",
  sf1_written:"Written safety procedures", rate:"Labor rate",
};

function CustomerDetailModal({ customer, onClose }) {
  const report = customer.phase_1_report || "";
  const intake = customer.intake_answers || {};

  const leaks = [1,2,3].map(n => ({
    name: getTag(report, `LEAK_${n}_NAME`) || getTag(report, `LEAK_RANKING`) ? null : null,
    range: getTag(report, `LEAK_${n}_RANGE`),
    why: getTag(report, `LEAK_${n}_WHY`),
    cost: getTag(report, `LEAK_${n}_COST`),
  })).filter(l => l.range);

  // Also check for old-style leak ranking tag
  const leakRanking = getTag(report, "LEAK_RANKING");
  const leakTotal = getTag(report, "LEAK_TOTAL") || getTag(report, "SNAPSHOT_TOTAL");
  const snapshotHeadline = getTag(report, "SNAPSHOT_HEADLINE");

  const leakColors = [C.amber, "#E67E22", C.slate];
  const intakeEntries = Object.entries(intake).filter(([k,v]) => v);

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:200, display:"flex", alignItems:"flex-start", justifyContent:"flex-end", overflow:"auto" }}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{ background:C.panel, width:"100%", maxWidth:600, minHeight:"100vh", borderLeft:"1px solid "+C.panelLight, padding:"24px", overflowY:"auto" }}>
        {/* Header */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
          <div>
            <div style={{ fontFamily:F.b, fontSize:18, fontWeight:700, color:C.white }}>{customer.name||"—"}</div>
            <div style={{ fontFamily:F.b, fontSize:13, color:C.ghost }}>{customer.biz} · {customer.trade}</div>
            <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginTop:2 }}>{customer.email}</div>
          </div>
          <button onClick={onClose} style={{ background:"none", border:"1px solid "+C.panelLight, color:C.muted, padding:"6px 12px", borderRadius:6, fontFamily:F.b, fontSize:12, cursor:"pointer" }}>✕ Close</button>
        </div>

        {/* Snapshot headline if exists */}
        {snapshotHeadline && (
          <div style={{ background:C.amber+"22", border:"1px solid "+C.amber+"44", borderRadius:8, padding:"12px 14px", marginBottom:16 }}>
            <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.amber, letterSpacing:1.5, marginBottom:4 }}>AI ANALYSIS</div>
            <div style={{ fontFamily:F.b, fontSize:13, color:C.white, lineHeight:1.65 }}>{snapshotHeadline}</div>
          </div>
        )}

        {/* Leak total */}
        {leakTotal && (
          <div style={{ background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:8, padding:"12px 14px", marginBottom:16, textAlign:"center" }}>
            <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:4 }}>TOTAL ESTIMATED ANNUAL LEAK</div>
            <div style={{ fontFamily:F.d, fontSize:24, fontWeight:800, color:C.amber }}>
              {leakTotal.replace(/.*?(\$[\d,]+.*)/,"$1")}
            </div>
          </div>
        )}

        {/* Leak math breakdown */}
        {leaks.length > 0 && (
          <div style={{ marginBottom:20 }}>
            <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:10 }}>LEAK MATH</div>
            {leaks.map((leak, i) => (
              <div key={i} style={{ background:C.navyDark, border:"1px solid "+C.panelLight, borderLeft:"3px solid "+leakColors[i], borderRadius:8, padding:"12px 14px", marginBottom:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <div style={{ fontFamily:F.b, fontSize:12, fontWeight:700, color:C.white }}>#{i+1}</div>
                  <div style={{ fontFamily:F.b, fontSize:13, fontWeight:700, color:leakColors[i] }}>{leak.range}</div>
                </div>
                {leak.cost && <div style={{ fontFamily:F.b, fontSize:12, color:C.ghost, lineHeight:1.6 }}>{leak.cost}</div>}
                {leak.why && <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, lineHeight:1.6, marginTop:6 }}>{leak.why}</div>}
              </div>
            ))}
          </div>
        )}

        {/* Old-style leak ranking */}
        {leakRanking && leaks.length === 0 && (
          <div style={{ background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:8, padding:"14px", marginBottom:20 }}>
            <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:8 }}>LEAK RANKING</div>
            <pre style={{ fontFamily:F.b, fontSize:12, color:C.ghost, lineHeight:1.7, whiteSpace:"pre-wrap", margin:0 }}>{leakRanking}</pre>
          </div>
        )}

        {/* Intake answers */}
        <div>
          <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:10 }}>INTAKE ANSWERS</div>
          {intakeEntries.length === 0
            ? <div style={{ fontFamily:F.b, fontSize:12, color:C.muted }}>No intake answers on file.</div>
            : intakeEntries.map(([k,v]) => (
              <div key={k} style={{ display:"flex", gap:12, padding:"8px 0", borderBottom:"1px solid "+C.panelLight+"44" }}>
                <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, width:180, flexShrink:0, lineHeight:1.5 }}>
                  {INTAKE_LABELS[k] || k}
                </div>
                <div style={{ fontFamily:F.b, fontSize:12, color:C.white, flex:1, lineHeight:1.5 }}>{v}</div>
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

function CustomersTable({ customers }) {
  const [search, setSearch] = useState("");
  const [sort, setSort] = useState("date");
  const [selected, setSelected] = useState(null);

  const filtered = customers.filter(c =>
    !search || c.email?.toLowerCase().includes(search.toLowerCase()) ||
    c.name?.toLowerCase().includes(search.toLowerCase()) ||
    c.biz?.toLowerCase().includes(search.toLowerCase())
  );

  const sorted = [...filtered].sort((a, b) => {
    if (sort === "date") return new Date(b.phase_1_date||0) - new Date(a.phase_1_date||0);
    if (sort === "progress") return (b.completed_days||0) - (a.completed_days||0);
    if (sort === "plan") return (PLAN_PRICES[b.plan_type]||0) - (PLAN_PRICES[a.plan_type]||0);
    return 0;
  });

  return (
    <>
    {selected && <CustomerDetailModal customer={selected} onClose={()=>setSelected(null)} />}
    <div style={{ background:C.panel, borderRadius:12, border:"1px solid "+C.panelLight, overflow:"hidden" }}>
      <div style={{ padding:"16px 20px", borderBottom:"1px solid "+C.panelLight, display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
        <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5 }}>CUSTOMERS <span style={{color:C.ghost,fontWeight:400}}>(click row for intake + math)</span></div>
        <div style={{ display:"flex", gap:8 }}>
          {[["date","Recent"],["progress","Progress"],["plan","Plan Value"]].map(([v,l]) => (
            <button key={v} onClick={()=>setSort(v)}
              style={{ padding:"6px 12px", borderRadius:6, border:"1px solid "+(sort===v?C.amber:C.panelLight), background:sort===v?C.amber+"22":"none", color:sort===v?C.amber:C.muted, fontSize:11, fontFamily:F.b, fontWeight:600 }}>
              {l}
            </button>
          ))}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..."
            style={{ padding:"6px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:6, fontSize:12, color:C.white, outline:"none", fontFamily:F.b, width:160 }} />
        </div>
      </div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse" }}>
          <thead>
            <tr style={{ background:C.navyDark }}>
              {["Name","Business","Trade","Plan","Progress","Status","Started"].map(h => (

// ── PLAN BREAKDOWN ────────────────────────────────────────────────────────────
function PlanBreakdown({ customers }) {
  const counts = {};
  const revenue = {};
  customers.forEach(c => {
    const p = c.plan_type || "unknown";
    counts[p] = (counts[p]||0) + 1;
    revenue[p] = (revenue[p]||0) + (PLAN_PRICES[p]||0);
  });

  return (
    <div style={{ background:C.panel, borderRadius:12, padding:"18px 20px", border:"1px solid "+C.panelLight }}>
      <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:16 }}>REVENUE BY PLAN</div>
      {Object.keys(PLAN_LABELS).map(p => {
        const count = counts[p]||0;
        const rev = revenue[p]||0;
        const color = PLAN_COLORS[p]||C.ghost;
        if (!count) return null;
        return (
          <div key={p} style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12 }}>
            <div style={{ width:10, height:10, borderRadius:"50%", background:color, flexShrink:0 }} />
            <div style={{ flex:1, fontFamily:F.b, fontSize:13, color:C.white }}>{PLAN_LABELS[p]}</div>
            <div style={{ fontFamily:F.b, fontSize:12, color:C.ghost }}>{count} customers</div>
            <div style={{ fontFamily:F.d, fontSize:18, fontWeight:800, color, minWidth:80, textAlign:"right" }}>${rev.toLocaleString()}</div>
          </div>
        );
      })}
    </div>
  );
}

// ── WHAT YOU NEED ─────────────────────────────────────────────────────────────
function WhatYouNeed({ mrr }) {
  function plansNeeded(target, current) {
    const gap = Math.max(0, target - current);
    return {
      snapshots: Math.ceil(gap / 99),
      thirtyDay: Math.ceil(gap / 299),
      bundles: Math.ceil(gap / 599),
      mixed: {
        bundles: Math.ceil(gap * 0.3 / 599),
        thirtyDay: Math.ceil(gap * 0.5 / 299),
        snapshots: Math.ceil(gap * 0.2 / 99),
      }
    };
  }

  function Row({ label, value, color }) {
    return (
      <div style={{ display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:"1px solid "+C.panelLight }}>
        <span style={{ fontFamily:F.b, fontSize:13, color:C.ghost }}>{label}</span>
        <span style={{ fontFamily:F.b, fontSize:13, fontWeight:700, color:color||C.white }}>{value}</span>
      </div>
    );
  }

  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
      {GOALS.map(goal => {
        const n = plansNeeded(goal.target, mrr);
        const gap = Math.max(0, goal.target - mrr);
        return (
          <div key={goal.target} style={{ background:C.panel, borderRadius:12, padding:"18px 20px", border:"1px solid "+C.panelLight }}>
            <div style={{ fontFamily:F.d, fontSize:16, fontWeight:800, color:goal.color, marginBottom:4 }}>{goal.label} by {goal.date}</div>
            <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:12 }}>{goal.note}</div>
            {gap === 0 ? (
              <div style={{ fontFamily:F.b, fontSize:13, color:C.green, fontWeight:700 }}>✓ Goal achieved!</div>
            ) : (
              <>
                <Row label="Gap" value={"$" + gap.toLocaleString()} color={goal.color} />
                <Row label="Snapshots only" value={n.snapshots + " × $99"} />
                <Row label="30-Day plans only" value={n.thirtyDay + " × $299"} />
                <Row label="Bundles only" value={n.bundles + " × $599"} />
                <Row label="Best mix" value={n.mixed.bundles + " bundles + " + n.mixed.thirtyDay + " plans + " + n.mixed.snapshots + " snaps"} />
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

function MarketingView({ leads, customers }) {
  const [source, setSource] = useState("fb-group-ma");
  const [customSource, setCustomSource] = useState("");
  const [page, setPage] = useState("");
  const [campaign, setCampaign] = useState("");
  const [copied, setCopied] = useState(false);

  const utmSource = customSource.trim() || source;
  const baseUrl = "https://www.compassbizsolutions.com" + page;
  const separator = page.includes("?") ? "&" : "?";
  const utmParams = [
    "utm_source=" + encodeURIComponent(utmSource),
    campaign ? "utm_campaign=" + encodeURIComponent(campaign) : "",
    "utm_medium=compass"
  ].filter(Boolean).join("&");
  const fullUrl = baseUrl + separator + utmParams;

  function copyUrl() {
    navigator.clipboard.writeText(fullUrl).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  // Analyze leads by UTM source
  const sourceStats = {};
  leads.forEach(l => {
    const src = l.utm_source || l.source || "direct";
    if (!sourceStats[src]) sourceStats[src] = { diagnostics: 0, purchases: 0, revenue: 0 };
    sourceStats[src].diagnostics++;
  });
  customers.forEach(c => {
    const src = c.utm_source || c.source || "direct";
    if (!sourceStats[src]) sourceStats[src] = { diagnostics: 0, purchases: 0, revenue: 0 };
    sourceStats[src].purchases++;
    sourceStats[src].revenue += PLAN_PRICES[c.plan_type] || 0;
  });

  const sortedSources = Object.entries(sourceStats)
    .sort((a, b) => b[1].revenue - a[1].revenue);

  // Weekly diagnostic trend
  const weeklyDiags = {};
  leads.forEach(l => {
    if (!l.created_at) return;
    const d = new Date(l.created_at);
    const weekStart = new Date(d);
    weekStart.setDate(d.getDate() - d.getDay());
    const key = weekStart.toLocaleDateString("en-US", { month:"short", day:"numeric" });
    weeklyDiags[key] = (weeklyDiags[key] || 0) + 1;
  });

  // Conversion funnel
  const totalDiags = leads.length;
  const totalPurchases = customers.length;
  const totalRevenue = customers.reduce((s, c) => s + (PLAN_PRICES[c.plan_type]||0), 0);
  const convRate = totalDiags > 0 ? Math.round((totalPurchases / totalDiags) * 100) : 0;

        <div style={{ fontFamily:F.d, fontSize:26, fontWeight:800, color:color||C.white }}>{value}</div>
        {sub && <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginTop:2 }}>{sub}</div>}
      </div>
    );
  }

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:20 }}>

      {/* Funnel stats */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:12 }}>
        <StatBox label="DIAGNOSTICS RUN" value={totalDiags} color={C.slate} />
        <StatBox label="SNAPSHOTS" value={snapshots} sub={"$" + (snapshots*99).toLocaleString()} color={C.amber} />
        <StatBox label="FIXKIT CUSTOMERS" value={fixkitCustomers} color={C.green} />

      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>

        {/* UTM Link Generator */}

          <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:14 }}>UTM LINK GENERATOR</div>
          <div style={{ marginBottom:10 }}>
            <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:4 }}>SOURCE / CHANNEL</div>
            <select value={source} onChange={e=>{ setSource(e.target.value); setCustomSource(""); }}

          <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:14 }}>WEEKLY DIAGNOSTIC RUNS</div>
          <div style={{ display:"flex", gap:8, alignItems:"flex-end", height:80 }}>
            {Object.entries(weeklyDiags).slice(-12).map(([week, count]) => {
              const max = Math.max(...Object.values(weeklyDiags));

                  <div style={{ fontFamily:F.b, fontSize:10, color:C.amber }}>{count}</div>

            return (

// ── INBOX VIEW ────────────────────────────────────────────────────────────────
function InboxView({ adminToken }) {
  const [emails, setEmails] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState("unread");
  const [draftBody, setDraftBody] = useState("");
  const [draftSubject, setDraftSubject] = useState("");
  const [generating, setGenerating] = useState(false);
  const [sending, setSending] = useState(false);
  const [err, setErr] = useState("");
  const [sent, setSent] = useState(false);

  async function load() {
    setLoading(true);
    try {
      const r = await fetch("/api/inbound-email?token=" + encodeURIComponent(adminToken));
      const d = await r.json();
      if (d.success) setEmails(d.emails || []);
    } catch(e) {}
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  async function selectEmail(email) {
    setSelected(email);
    setDraftBody(email.aiDraft || "");
    setDraftSubject("Re: " + email.subject);
    setErr(""); setSent(false);
    // Mark as read
    if (email.status === "unread") {
      await fetch("/api/inbound-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": adminToken },
        body: JSON.stringify({ action:"mark_status", inboundKey: getKey(email), status:"read" })
      });
      load();
    }
  }

  function getKey(email) {
    const ek = (email.from||"").toLowerCase().replace(/[^a-z0-9@._-]/g,"");
    return "inbound:" + ek + ":" + new Date(email.receivedAt).getTime();
  }

  async function generateDraft() {
    if (!selected) return;
    setGenerating(true); setErr("");
    try {
      const r = await fetch("/api/inbound-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": adminToken },
        body: JSON.stringify({ action:"generate_draft", inboundKey: getKey(selected) })
      });
      const d = await r.json();
      if (d.success) setDraftBody(d.draft);
      else setErr(d.error || "Generation failed");
    } catch(e) { setErr("Connection error"); }
    setGenerating(false);
  }

  async function sendReply() {
    if (!draftBody.trim() || !selected) return;
    setSending(true); setErr("");
    try {
      const r = await fetch("/api/inbound-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": adminToken },
        body: JSON.stringify({ action:"send_reply", inboundKey: getKey(selected), body: draftBody, subject: draftSubject })
      });
      const d = await r.json();
      if (d.success) { setSent(true); setSelected(null); setDraftBody(""); load(); }
      else setErr(d.error || "Send failed");
    } catch(e) { setErr("Connection error"); }
    setSending(false);
  }

  async function markManual() {
    if (!selected) return;
    await fetch("/api/inbound-email", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-token": adminToken },
      body: JSON.stringify({ action:"mark_status", inboundKey: getKey(selected), status:"manual" })
    });
    setSelected(null); load();
  }

  const filtered = emails.filter(e => {
    if (filter === "unread") return e.status === "unread";
    if (filter === "read") return e.status === "read";
    if (filter === "replied") return e.status === "replied";
    if (filter === "manual") return e.status === "manual";
    return true;
  });

  const unreadCount = emails.filter(e => e.status === "unread").length;

  return (
    <div style={{ display:"flex", gap:16, height:"calc(100vh - 160px)", minHeight:400 }}>

      {/* Left — email list */}
      <div style={{ width:320, flexShrink:0, display:"flex", flexDirection:"column", gap:10 }}>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
          {[["all","All"],["unread","Unread"+(unreadCount>0?" ("+unreadCount+")":"")],["read","Read"],["replied","Replied"],["manual","Manual"]].map(([v,l]) => (
            <button key={v} onClick={()=>setFilter(v)}
              style={{ padding:"4px 12px", borderRadius:99, border:"1px solid "+(filter===v?C.amber:C.panelLight), background:filter===v?C.amber+"22":"none", color:filter===v?C.amber:C.muted, fontSize:11, fontFamily:F.b, fontWeight:600, cursor:"pointer" }}>
              {l}
            </button>
          ))}
        </div>
        <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column", gap:6 }}>
          {loading ? (
            <div style={{ fontFamily:F.b, fontSize:12, color:C.muted, textAlign:"center", padding:"24px 0" }}>Loading...</div>
          ) : filtered.length === 0 ? (
            <div style={{ fontFamily:F.b, fontSize:12, color:C.muted, textAlign:"center", padding:"24px 0" }}>No emails</div>
          ) : filtered.map((e, i) => (
            <div key={i} onClick={()=>selectEmail(e)}
              style={{ background:selected===e?C.navyDark:C.panel, border:"1px solid "+(selected===e?C.amber:C.panelLight), borderRadius:10, padding:"10px 14px", cursor:"pointer", transition:"all 0.12s" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:4 }}>
                <div style={{ fontFamily:F.b, fontSize:13, fontWeight:e.status==="unread"?700:500, color:C.white, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:180 }}>
                  {e.fromName || e.from}
                </div>
                <span style={{ background:e.status==="unread"?C.amber+"22":e.status==="replied"?C.green+"22":"rgba(255,255,255,0.05)", color:e.status==="unread"?C.amber:e.status==="replied"?C.green:C.muted, borderRadius:99, padding:"1px 7px", fontSize:10, fontWeight:700, fontFamily:F.b, flexShrink:0 }}>
                  {e.status}
                </span>
              </div>
              <div style={{ fontFamily:F.b, fontSize:12, color:C.ghost, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", marginBottom:3 }}>{e.subject}</div>
              <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>{e.from}</div>
              <div style={{ fontFamily:F.b, fontSize:10, color:C.muted, marginTop:3 }}>{new Date(e.receivedAt).toLocaleDateString()} {new Date(e.receivedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Right — email detail + reply */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", gap:12, overflow:"hidden" }}>
        {!selected ? (
          <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", background:C.panel, borderRadius:12, border:"1px solid "+C.panelLight }}>
            <div style={{ textAlign:"center" }}>
              <div style={{ fontFamily:F.d, fontSize:18, fontWeight:700, color:C.muted, marginBottom:8 }}>SELECT AN EMAIL</div>
              <div style={{ fontFamily:F.b, fontSize:13, color:C.muted }}>Click an email on the left to read and reply</div>
            </div>
          </div>
        ) : (
          <>
            {/* Email content */}
            <div style={{ background:C.panel, border:"1px solid "+C.panelLight, borderRadius:12, padding:"16px 18px", flexShrink:0 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
                <div>
                  <div style={{ fontFamily:F.b, fontSize:14, fontWeight:700, color:C.white }}>{selected.subject}</div>
                  <div style={{ fontFamily:F.b, fontSize:12, color:C.muted, marginTop:2 }}>
                    From: {selected.fromName ? selected.fromName + " <" + selected.from + ">" : selected.from}
                  </div>
                  <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>{new Date(selected.receivedAt).toLocaleString()}</div>
                </div>
                <button onClick={markManual}
                  style={{ background:"none", border:"1px solid "+C.panelLight, color:C.muted, padding:"5px 12px", borderRadius:6, fontFamily:F.b, fontSize:11, cursor:"pointer" }}>
                  Handle Manually
                </button>
              </div>
              <div style={{ background:C.navyDark, borderRadius:8, padding:"12px 14px", maxHeight:150, overflowY:"auto" }}>
                <pre style={{ fontFamily:F.b, fontSize:13, color:C.ghost, lineHeight:1.7, whiteSpace:"pre-wrap", wordBreak:"break-word", margin:0 }}>
                  {selected.textBody || "(no plain text body)"}
                </pre>
              </div>
            </div>

            {/* Reply composer */}
            <div style={{ background:C.panel, border:"1px solid "+C.panelLight, borderRadius:12, padding:"16px 18px", flex:1, display:"flex", flexDirection:"column" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5 }}>REPLY</div>
                <button onClick={generateDraft} disabled={generating}
                  style={{ background:generating?"rgba(127,119,221,0.3)":"rgba(127,119,221,0.2)", border:"1px solid rgba(127,119,221,0.4)", color:"#AFA9EC", padding:"6px 14px", borderRadius:7, fontFamily:F.b, fontSize:12, fontWeight:700, cursor:generating?"wait":"pointer" }}>
                  {generating ? "Generating..." : "✦ AI Draft"}
                </button>
              </div>
              <input value={draftSubject} onChange={e=>setDraftSubject(e.target.value)}
                style={{ width:"100%", padding:"8px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:13, color:C.white, outline:"none", fontFamily:F.b, boxSizing:"border-box", marginBottom:8 }} />
              <textarea value={draftBody} onChange={e=>setDraftBody(e.target.value)}
                style={{ flex:1, width:"100%", padding:"10px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:13, color:C.white, outline:"none", fontFamily:F.b, boxSizing:"border-box", resize:"none", lineHeight:1.7 }}
                placeholder="Write your reply or click AI Draft to generate one..." />
              {err && <div style={{ fontFamily:F.b, fontSize:12, color:C.red, marginTop:6 }}>{err}</div>}
              {sent && <div style={{ fontFamily:F.b, fontSize:12, color:C.green, marginTop:6 }}>✓ Reply sent</div>}
              <div style={{ display:"flex", gap:8, marginTop:10 }}>
                <button onClick={()=>setSelected(null)}
                  style={{ padding:"9px 16px", background:"none", border:"1px solid "+C.panelLight, color:C.muted, borderRadius:8, fontFamily:F.b, fontSize:13, cursor:"pointer" }}>
                  Cancel
                </button>
                <button onClick={sendReply} disabled={sending||!draftBody.trim()}
                  style={{ flex:1, padding:"9px 16px", background:C.amber, border:"none", color:"white", borderRadius:8, fontFamily:F.b, fontSize:13, fontWeight:700, cursor:sending?"wait":"pointer", opacity:(sending||!draftBody.trim())?.7:1 }}>
                  {sending ? "Sending..." : "Send Reply from jen@ →"}
                </button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── PERSON DETAIL PANEL ───────────────────────────────────────────────────────
function PersonPanel({ emailKey, adminToken, onClose }) {
  const [person, setPerson] = useState(null);
  const [loading, setLoading] = useState(true);
  const [activeSection, setActiveSection] = useState("overview");
  const [note, setNote] = useState("");
  const [savingNote, setSavingNote] = useState(false);
  const [emailSubject, setEmailSubject] = useState("");
  const [emailBody, setEmailBody] = useState("");
  const [sendingEmail, setSendingEmail] = useState(false);
  const [emailSent, setEmailSent] = useState(false);
  const [invDesc, setInvDesc] = useState("");
  const [invAmount, setInvAmount] = useState("");
  const [invHours, setInvHours] = useState("");
  const [invRateType, setInvRateType] = useState("flat");
  const [invDue, setInvDue] = useState("");
  const [creatingInv, setCreatingInv] = useState(false);
  const [invCreated, setInvCreated] = useState(false);
  const [overridePlan, setOverridePlan] = useState("");
  const [err, setErr] = useState("");

  async function load() {
    setLoading(true);
    try {
      const r = await fetch("/api/admin-person?token=" + encodeURIComponent(adminToken) + "&email=" + encodeURIComponent(emailKey));
      const d = await r.json();
      if (d.success) { setPerson(d.person); setOverridePlan(d.person.customer?.planType || ""); }
    } catch(e) {}
    setLoading(false);
  }

  useEffect(() => { load(); }, [emailKey]);

  async function action(body) {
    const r = await fetch("/api/admin-person", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-token": adminToken },
      body: JSON.stringify(Object.assign({ email: emailKey }, body))
    });
    return r.json();
  }

  async function saveNote() {
    if (!note.trim()) return;
    setSavingNote(true);
    await action({ action:"save_note", text: note });
    setNote(""); await load(); setSavingNote(false);
  }

  async function deleteNote(id) {
    await action({ action:"delete_note", noteId: id });
    await load();
  }

  async function sendEmail() {
    if (!emailSubject || !emailBody) { setErr("Subject and body required"); return; }
    setSendingEmail(true); setErr("");
    const d = await action({ action:"send_email", subject: emailSubject, body: emailBody });
    if (d.success) { setEmailSent(true); setEmailSubject(""); setEmailBody(""); setTimeout(()=>setEmailSent(false),3000); }
    else setErr(d.error || "Send failed");
    setSendingEmail(false);
  }

  async function createInvoice() {
    if (!invDesc || !invAmount) { setErr("Description and amount required"); return; }
    setCreatingInv(true); setErr("");
    const d = await action({ action:"create_invoice", description:invDesc, amount:invAmount, hours:invHours, rateType:invRateType, dueDate:invDue });
    if (d.success) { setInvCreated(true); setInvDesc(""); setInvAmount(""); setInvHours(""); await load(); setTimeout(()=>setInvCreated(false),3000); }
    else setErr(d.error || "Failed");
    setCreatingInv(false);
  }

  async function markPaid(invoiceId) {
    await action({ action:"mark_invoice_paid", invoiceId });
    await load();
  }

  async function doOverridePlan() {
    if (!overridePlan) return;
    await action({ action:"override_plan", planType: overridePlan });
    await load();
  }

  if (loading) return (
    <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"flex-end" }}>
      <div style={{ background:C.panel,width:"100%",maxWidth:640,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center" }}>
        <div style={{ fontFamily:F.b,fontSize:13,color:C.muted }}>Loading...</div>
      </div>
    </div>
  );

  if (!person) return null;

  const stage = PIPELINE_STAGES.find(s => s.key === person.status) || PIPELINE_STAGES[0];
  const sections = ["overview","intake","numbers","emails","notes","invoices","actions"];

  return (
    <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:300,display:"flex",alignItems:"stretch",justifyContent:"flex-end" }}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:C.navy,width:"100%",maxWidth:680,height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden" }}>

        {/* Header */}
        <div style={{ background:C.navyDark,padding:"16px 20px",borderBottom:"1px solid "+C.panelLight,flexShrink:0 }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8 }}>
            <div>
              <div style={{ fontFamily:F.d,fontSize:20,fontWeight:800,color:C.white,letterSpacing:0.5 }}>{person.name||person.email}</div>
              <div style={{ fontFamily:F.b,fontSize:12,color:C.ghost,marginTop:2 }}>{person.email} {person.trade&&"· "+person.trade} {person.biz&&"· "+person.biz}</div>
            </div>
            <button onClick={onClose} style={{ background:"none",border:"1px solid "+C.panelLight,color:C.muted,padding:"5px 12px",borderRadius:6,fontFamily:F.b,fontSize:12,cursor:"pointer" }}>✕</button>
          </div>
          {/* Pipeline status */}
          <div style={{ display:"flex",alignItems:"center",gap:6,flexWrap:"wrap" }}>
            <span style={{ background:stage.color+"22",color:stage.color,border:"1px solid "+stage.color+"44",borderRadius:99,padding:"3px 12px",fontSize:11,fontWeight:700,fontFamily:F.b }}>{stage.label}</span>
            {person.planType && <span style={{ background:C.amber+"22",color:C.amber,border:"1px solid "+C.amber+"44",borderRadius:99,padding:"3px 10px",fontSize:11,fontFamily:F.b }}>{PLAN_LABELS_P[person.planType]||person.planType}</span>}
            {person.leakTotal && <span style={{ background:"rgba(255,255,255,0.06)",color:C.ghost,borderRadius:99,padding:"3px 10px",fontSize:11,fontFamily:F.b }}>Leak: {person.leakTotal}</span>}
            {person.progressPct > 0 && <span style={{ background:C.green+"22",color:C.green,border:"1px solid "+C.green+"33",borderRadius:99,padding:"3px 10px",fontSize:11,fontFamily:F.b }}>{person.progressPct}% complete</span>}
            {person.outstandingBalance > 0 && <span style={{ background:C.red+"22",color:C.red,border:"1px solid "+C.red+"33",borderRadius:99,padding:"3px 10px",fontSize:11,fontFamily:F.b }}>${person.outstandingBalance} outstanding</span>}
          </div>
        </div>

        {/* Section tabs */}
        <div style={{ display:"flex",borderBottom:"1px solid "+C.panelLight,flexShrink:0,overflowX:"auto" }}>
          {sections.map(s => (
            <button key={s} onClick={()=>setActiveSection(s)}
              style={{ padding:"10px 16px",background:"none",border:"none",borderBottom:"2px solid "+(activeSection===s?C.amber:"transparent"),color:activeSection===s?C.amber:C.muted,fontFamily:F.b,fontSize:12,fontWeight:activeSection===s?700:500,cursor:"pointer",whiteSpace:"nowrap",textTransform:"capitalize" }}>
              {s === "intake" ? "Intake" : s === "numbers" ? "Numbers" : s.charAt(0).toUpperCase()+s.slice(1)}
            </button>
          ))}
        </div>

        {/* Content */}
        <div style={{ flex:1,overflowY:"auto",padding:"18px 20px" }}>

          {/* OVERVIEW */}
          {activeSection === "overview" && (
            <div style={{ display:"flex",flexDirection:"column",gap:12 }}>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:10 }}>
                {[
                  ["Source", person.source||"—"],
                  ["Added", person.addedAt?new Date(person.addedAt).toLocaleDateString():"—"],
                  ["Last Activity", person.lastActivity?new Date(person.lastActivity).toLocaleDateString():"—"],
                  ["Emails Sent", (person.emailsSent||0)+"/3"],
                  ["Days Since Active", person.daysSinceActivity===999?"Never":person.daysSinceActivity+"d"],

// ── PEOPLE VIEW ───────────────────────────────────────────────────────────────
function PeopleView({ adminToken }) {
  const [people, setPeople] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");
  const [selected, setSelected] = useState(null);

  async function load() {
    setLoading(true);
    try {
      const r = await fetch("/api/admin-people?token=" + encodeURIComponent(adminToken));
      const d = await r.json();
      if (d.success) setPeople(d.people || []);
    } catch(e) {}
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  const filtered = people.filter(p => {
    if (filter !== "all" && p.status !== filter) return false;
    if (!search) return true;
    const q = search.toLowerCase();
    return p.email?.toLowerCase().includes(q) || p.name?.toLowerCase().includes(q) ||
           p.trade?.toLowerCase().includes(q) || p.biz?.toLowerCase().includes(q);
  });

  const counts = {};
  people.forEach(p => { counts[p.status] = (counts[p.status]||0)+1; });
  const total = people.length;

  return (
    <>
      {selected && <PersonPanel emailKey={selected} adminToken={adminToken} onClose={()=>{ setSelected(null); load(); }} />}

      <div style={{ display:"flex",flexDirection:"column",gap:16 }}>

        {/* Pipeline summary */}
        <div style={{ display:"flex",gap:8,flexWrap:"wrap" }}>
          {PIPELINE_STAGES.map(s => (
            <div key={s.key} onClick={()=>setFilter(filter===s.key?"all":s.key)}
              style={{ background:filter===s.key?s.color+"33":C.panel,border:"1px solid "+(filter===s.key?s.color:C.panelLight),borderRadius:10,padding:"10px 14px",cursor:"pointer",minWidth:90,textAlign:"center",transition:"all 0.15s" }}>
              <div style={{ fontFamily:F.d,fontSize:22,fontWeight:800,color:filter===s.key?s.color:C.white }}>{counts[s.key]||0}</div>
              <div style={{ fontFamily:F.b,fontSize:10,color:filter===s.key?s.color:C.muted,marginTop:2 }}>{s.label}</div>
            </div>
          ))}
          <div style={{ background:C.panel,border:"1px solid "+C.panelLight,borderRadius:10,padding:"10px 14px",minWidth:90,textAlign:"center" }}>
            <div style={{ fontFamily:F.d,fontSize:22,fontWeight:800,color:C.amber }}>{total}</div>
            <div style={{ fontFamily:F.b,fontSize:10,color:C.muted,marginTop:2 }}>Total</div>
          </div>
        </div>

        {/* Search */}
        <div style={{ display:"flex",gap:10,alignItems:"center" }}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, email, trade, business..."
            style={{ flex:1,padding:"9px 14px",background:C.panel,border:"1px solid "+C.panelLight,borderRadius:8,fontSize:13,color:C.white,outline:"none",fontFamily:F.b }} />
          {filter !== "all" && (
            <button onClick={()=>setFilter("all")} style={{ background:"none",border:"1px solid "+C.panelLight,color:C.muted,padding:"8px 14px",borderRadius:8,fontFamily:F.b,fontSize:12,cursor:"pointer" }}>Clear filter</button>
          )}
          <button onClick={load} style={{ background:C.panelLight,border:"none",color:C.ghost,padding:"8px 14px",borderRadius:8,fontFamily:F.b,fontSize:12,cursor:"pointer" }}>↻</button>
        </div>

        {/* People list */}
        <div style={{ background:C.panel,borderRadius:12,border:"1px solid "+C.panelLight,overflow:"hidden" }}>
          {loading ? (
            <div style={{ padding:"32px",textAlign:"center",fontFamily:F.b,fontSize:13,color:C.muted }}>Loading people...</div>
          ) : filtered.length === 0 ? (
            <div style={{ padding:"32px",textAlign:"center",fontFamily:F.b,fontSize:13,color:C.muted }}>No people found</div>
          ) : filtered.map((p, i) => {
            const stage = PIPELINE_STAGES.find(s=>s.key===p.status)||PIPELINE_STAGES[0];
            return (
              <div key={i} onClick={()=>setSelected(p.email)}
                style={{ display:"flex",gap:14,padding:"13px 18px",borderBottom:"1px solid "+C.panelLight+(i===filtered.length-1?"00":""),cursor:"pointer",transition:"background 0.12s",alignItems:"center" }}
                onMouseEnter={e=>e.currentTarget.style.background=C.navyDark}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                {/* Avatar */}
                <div style={{ width:36,height:36,borderRadius:"50%",background:stage.color+"33",border:"1.5px solid "+stage.color+"66",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>
                  <span style={{ fontFamily:F.d,fontSize:14,fontWeight:800,color:stage.color }}>
                    {(p.name||p.email||"?").charAt(0).toUpperCase()}
                  </span>
                </div>
                {/* Info */}
                <div style={{ flex:1,minWidth:0 }}>
                  <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:2 }}>
                    <div style={{ fontFamily:F.b,fontSize:14,fontWeight:600,color:C.white,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{p.name||p.email}</div>
                    <span style={{ background:stage.color+"22",color:stage.color,border:"1px solid "+stage.color+"44",borderRadius:99,padding:"1px 8px",fontSize:10,fontWeight:700,fontFamily:F.b,flexShrink:0 }}>{stage.label}</span>
                  </div>
                  <div style={{ fontFamily:F.b,fontSize:11,color:C.muted }}>
                    {p.email} {p.trade&&"· "+p.trade} {p.biz&&"· "+p.biz}
                  </div>
                </div>
                {/* Right side */}
                <div style={{ display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0 }}>
                  {p.leakTotal && <div style={{ fontFamily:F.b,fontSize:11,color:C.amber,fontWeight:700 }}>{p.leakTotal}</div>}
                  {p.progressPct > 0 && <div style={{ fontFamily:F.b,fontSize:11,color:C.green }}>{p.progressPct}% done</div>}
                  {p.outstandingBalance > 0 && <div style={{ fontFamily:F.b,fontSize:11,color:C.red }}>${p.outstandingBalance} due</div>}
                  <div style={{ fontFamily:F.b,fontSize:10,color:C.muted }}>{p.daysSinceActivity===999?"Never":p.daysSinceActivity===0?"Today":p.daysSinceActivity+"d ago"}</div>
                </div>
                <div style={{ color:C.muted,fontSize:16 }}>›</div>
              </div>
            );
          })}
        </div>
      </div>
    </>
  );
}

function ContactsManager({ adminToken }) {
  const [contacts, setContacts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [csv, setCsv] = useState("");
  const [uploading, setUploading] = useState(false);
  const [uploadResult, setUploadResult] = useState(null);
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");

  async function loadContacts() {
    setLoading(true);
    try {
      const r = await fetch("/api/contacts?token=" + encodeURIComponent(adminToken));
      const d = await r.json();
      if (d.success) setContacts(d.contacts || []);
    } catch(e) {}
    setLoading(false);
  }

  useEffect(() => { loadContacts(); }, []);

  async function uploadCSV() {
    const lines = csv.trim().split("\n").filter(l => l.trim());
    if (!lines.length) return;
    setUploading(true); setUploadResult(null);
    try {
      // Parse CSV — skip header row if it starts with "name" or "first"
      const rows = lines.filter(l => !l.toLowerCase().startsWith("first") && !l.toLowerCase().startsWith("name"));
      const contacts = rows.map(line => {
        const parts = line.split(",").map(p => p.trim().replace(/^"|"$/g, ""));
        return { firstName: parts[0]||"", lastName: parts[1]||"", email: parts[2]||"", trade: parts[3]||"", biz: parts[4]||"", source: parts[5]||"csv" };
      });
      const r = await fetch("/api/contacts", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-token": adminToken },
        body: JSON.stringify({ contacts })
      });
      const d = await r.json();
      setUploadResult(d);
      if (d.success) { setCsv(""); loadContacts(); }
    } catch(e) { setUploadResult({ error: e.message }); }
    setUploading(false);
  }

  async function removeContact(email, unsub) {
    try {
      await fetch("/api/contacts", {
        method: "DELETE",
        headers: { "Content-Type": "application/json", "x-admin-token": adminToken },
        body: JSON.stringify({ email, unsubscribe: unsub })
      });
      loadContacts();
    } catch(e) {}
  }

  const filtered = contacts.filter(c => {
    if (filter === "pending") return !c.email1_sent && !c.unsubscribed;
    if (filter === "contacted") return c.email1_sent && !c.purchased;
    if (filter === "purchased") return c.purchased;
    if (filter === "unsubscribed") return c.unsubscribed;
    return !c.unsubscribed || filter === "all";
  }).filter(c => !search ||
    c.email?.toLowerCase().includes(search.toLowerCase()) ||
    c.firstName?.toLowerCase().includes(search.toLowerCase()) ||
    c.trade?.toLowerCase().includes(search.toLowerCase())
  );

  const stats = {
    total: contacts.filter(c => !c.unsubscribed).length,
    pending: contacts.filter(c => !c.email1_sent && !c.unsubscribed).length,
    contacted: contacts.filter(c => c.email1_sent && !c.purchased && !c.unsubscribed).length,
    purchased: contacts.filter(c => c.purchased).length,
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:20 }}>

      {/* Stats */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12 }}>
        {[["TOTAL","total",C.slate],["PENDING","pending",C.amber],["CONTACTED","contacted",C.green],["PURCHASED","purchased",C.gold]].map(([l,k,color]) => (
          <div key={k} style={{ background:C.panel, border:"1px solid "+C.panelLight, borderRadius:10, padding:"14px 18px" }}>
            <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:6 }}>{l}</div>
            <div style={{ fontFamily:F.d, fontSize:28, fontWeight:800, color }}>{stats[k]}</div>
          </div>
        ))}
      </div>

      {/* CSV Upload */}
      <div style={{ background:C.panel, border:"1px solid "+C.panelLight, borderRadius:12, padding:"18px 20px" }}>
        <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:6 }}>UPLOAD CONTACTS (CSV)</div>
        <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:10 }}>
          Format: FirstName, LastName, Email, Trade, BusinessName, Source — one per line. Header row optional (will be skipped).
        </div>
        <textarea value={csv} onChange={e=>setCsv(e.target.value)} rows={6}
          placeholder={"FirstName,LastName,Email,Trade,BusinessName,Source\nMike,Johnson,mike@johnsonhvac.com,HVAC,Johnson HVAC,MA License\nSarah,Williams,sarah@williamspipes.com,Plumbing,Williams Plumbing,Google Maps"}
          style={{ width:"100%", padding:"10px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:8, fontSize:12, color:C.white, outline:"none", fontFamily:"monospace", boxSizing:"border-box", resize:"vertical" }} />
        {uploadResult && (
          <div style={{ fontFamily:F.b, fontSize:12, marginTop:8, color:uploadResult.error?C.red:C.green }}>
            {uploadResult.error || `✓ Added ${uploadResult.added} · Skipped ${uploadResult.skipped} duplicates · ${uploadResult.errors} errors`}
          </div>
        )}
        <div style={{ display:"flex", gap:10, marginTop:10, alignItems:"center" }}>
          <button onClick={uploadCSV} disabled={uploading||!csv.trim()}
            style={{ padding:"9px 20px", background:C.amber, border:"none", color:"white", borderRadius:8, fontFamily:F.b, fontSize:13, fontWeight:700, cursor:uploading?"wait":"pointer", opacity:(uploading||!csv.trim())?.6:1 }}>
            {uploading ? "Uploading..." : "Upload Contacts →"}
          </button>
          <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>
            Contacts are queued for outreach — sending starts when ENABLED=true in send-scheduled.js
          </div>
        </div>
      </div>

      {/* Contact list */}
      <div style={{ background:C.panel, border:"1px solid "+C.panelLight, borderRadius:12, overflow:"hidden" }}>
        <div style={{ padding:"14px 18px", borderBottom:"1px solid "+C.panelLight, display:"flex", gap:10, flexWrap:"wrap", alignItems:"center" }}>
          <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginRight:4 }}>CONTACTS</div>
          {[["all","All"],["pending","Pending"],["contacted","Contacted"],["purchased","Purchased"],["unsubscribed","Unsub"]].map(([v,l]) => (
            <button key={v} onClick={()=>setFilter(v)}
              style={{ padding:"4px 12px", borderRadius:99, border:"1px solid "+(filter===v?C.amber:C.panelLight), background:filter===v?C.amber+"22":"none", color:filter===v?C.amber:C.muted, fontSize:11, fontFamily:F.b, fontWeight:600 }}>
              {l}
            </button>
          ))}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..."
            style={{ padding:"5px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:6, fontSize:12, color:C.white, outline:"none", fontFamily:F.b, marginLeft:"auto", width:160 }} />
        </div>
        {loading ? (
          <div style={{ padding:"24px", textAlign:"center", fontFamily:F.b, fontSize:12, color:C.muted }}>Loading...</div>
        ) : (
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead>
                <tr style={{ background:C.navyDark }}>
                  {["Name","Email","Trade","Source","Status","Emails Sent","Added"].map(h => (
                    <th key={h} style={{ padding:"9px 14px", textAlign:"left", fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1, whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                  <th style={{ padding:"9px 14px" }} />
                </tr>
              </thead>
              <tbody>
                {filtered.map((c, i) => {
                  const emailsSent = [c.email1_sent, c.email2_sent, c.email3_sent].filter(Boolean).length;
                  const statusColor = c.unsubscribed ? C.red : c.purchased ? C.green : c.email1_sent ? C.amber : C.muted;
                  const statusLabel = c.unsubscribed ? "Unsub" : c.purchased ? "Purchased" : c.email1_sent ? "Contacted" : "Pending";
                  return (
                    <tr key={i} style={{ borderTop:"1px solid "+C.panelLight, background:i%2===0?"transparent":C.navyDark+"44" }}>
                      <td style={{ padding:"9px 14px", fontFamily:F.b, fontSize:12, color:C.white }}>{c.firstName} {c.lastName}</td>
                      <td style={{ padding:"9px 14px", fontFamily:F.b, fontSize:11, color:C.ghost }}>{c.email}</td>
                      <td style={{ padding:"9px 14px", fontFamily:F.b, fontSize:11, color:C.amber }}>{c.trade||"—"}</td>
                      <td style={{ padding:"9px 14px", fontFamily:F.b, fontSize:11, color:C.muted }}>{c.source||"—"}</td>
                      <td style={{ padding:"9px 14px" }}>
                        <span style={{ background:statusColor+"22", color:statusColor, border:"1px solid "+statusColor+"44", borderRadius:99, padding:"2px 8px", fontSize:10, fontWeight:700, fontFamily:F.b }}>{statusLabel}</span>
                      </td>
                      <td style={{ padding:"9px 14px", fontFamily:F.b, fontSize:12, color:C.ghost }}>{emailsSent}/3</td>
                      <td style={{ padding:"9px 14px", fontFamily:F.b, fontSize:11, color:C.ghost }}>{c.addedAt ? new Date(c.addedAt).toLocaleDateString() : "—"}</td>
                      <td style={{ padding:"9px 14px" }}>
                        {!c.unsubscribed && (
                          <button onClick={()=>removeContact(c.email, true)}
                            style={{ background:"none", border:"none", color:C.muted, fontSize:11, fontFamily:F.b, cursor:"pointer" }}>Unsub</button>
                        )}
                      </td>
                    </tr>
                  );
                })}
                {filtered.length === 0 && (
                  <tr><td colSpan={8} style={{ padding:"24px", textAlign:"center", fontFamily:F.b, fontSize:12, color:C.muted }}>No contacts found</td></tr>
                )}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function OutreachTool({ adminToken }) {
  const [firstName, setFirstName] = useState("");
  const [lastName, setLastName] = useState("");
  const [email, setEmail] = useState("");
  const [trade, setTrade] = useState("");
  const [biz, setBiz] = useState("");
  const [templateNum, setTemplateNum] = useState(1);
  const [preview, setPreview] = useState(null);
  const [previewing, setPreviewing] = useState(false);
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(null);
  const [err, setErr] = useState("");
  const [log, setLog] = useState([]);
  const [logLoading, setLogLoading] = useState(true);
  const [batchMode, setBatchMode] = useState(false);
  const [batchCSV, setBatchCSV] = useState("");
  const [batchResults, setBatchResults] = useState([]);
  const [batchSending, setBatchSending] = useState(false);

  useEffect(() => {
    fetch("/api/send-outreach?token=" + encodeURIComponent(adminToken))
      .then(r => r.json())
      .then(d => { if (d.success) setLog(d.log || []); setLogLoading(false); })
      .catch(() => setLogLoading(false));
  }, [sent]);

  async function getPreview() {
    if (!firstName || !email.includes("@")) { setErr("First name and valid email required to preview."); return; }
    setPreviewing(true); setErr("");
    try {
      const r = await fetch("/api/send-outreach", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: adminToken, toEmail: email, firstName, lastName, trade, biz, templateNum, preview: true })
      });
      const d = await r.json();
      if (d.success) setPreview(d);
      else setErr(d.error || "Preview failed");
    } catch(e) { setErr("Connection error"); }
    setPreviewing(false);
  }

  async function sendEmail() {
    if (!firstName || !email.includes("@")) { setErr("First name and valid email required."); return; }
    setSending(true); setErr("");
    try {
      const r = await fetch("/api/send-outreach", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: adminToken, toEmail: email, firstName, lastName, trade, biz, templateNum })
      });
      const d = await r.json();
      if (d.success) {
        setSent(d.subject);
        setFirstName(""); setLastName(""); setEmail(""); setBiz(""); setPreview(null);
        setTimeout(() => setSent(null), 4000);
      } else { setErr(d.error || "Send failed"); }
    } catch(e) { setErr("Connection error"); }
    setSending(false);
  }

  async function sendBatch() {
    const lines = batchCSV.trim().split("\n").filter(l => l.trim());
    if (!lines.length) { setErr("Paste CSV data first."); return; }
    setBatchSending(true); setBatchResults([]);
    const results = [];
    for (const line of lines) {
      const parts = line.split(",").map(p => p.trim().replace(/^"|"$/g, ""));
      const [fn, ln, em, tr, bz] = parts;
      if (!em || !em.includes("@")) { results.push({ email: em || "?", status: "skipped", note: "Invalid email" }); continue; }
      try {
        const r = await fetch("/api/send-outreach", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: adminToken, toEmail: em, firstName: fn, lastName: ln, trade: tr || trade, biz: bz, templateNum })
        });
        const d = await r.json();
        results.push({ email: em, name: fn, status: d.success ? "sent" : "failed", note: d.success ? d.subject : d.error });
        await new Promise(res => setTimeout(res, 300)); // rate limit
      } catch(e) { results.push({ email: em, status: "error", note: e.message }); }
      setBatchResults([...results]);
    }
    setBatchSending(false);
    setSent("Batch complete — " + results.filter(r => r.status === "sent").length + " sent");
    setTimeout(() => setSent(null), 5000);
  }

  const tpl = EMAIL_TEMPLATES[templateNum];

  return (
    <div style={{ display:"flex", gap:20, alignItems:"flex-start", flexWrap:"wrap" }}>

      {/* Left — compose */}
      <div style={{ flex:"1 1 380px", display:"flex", flexDirection:"column", gap:14 }}>

        {/* Template selector */}
        <div style={{ background:C.panel, borderRadius:12, border:"1px solid "+C.panelLight, padding:"16px 20px" }}>
          <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:12 }}>SELECT TEMPLATE</div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {Object.entries(EMAIL_TEMPLATES).map(([n, t]) => (
              <div key={n} onClick={()=>{ setTemplateNum(parseInt(n)); setPreview(null); }}
                style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", borderRadius:8, border:"1px solid "+(templateNum===parseInt(n)?t.color:C.panelLight), background:templateNum===parseInt(n)?t.color+"18":"transparent", cursor:"pointer" }}>
                <div style={{ width:8, height:8, borderRadius:"50%", background:t.color, flexShrink:0 }} />
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:F.b, fontSize:13, fontWeight:600, color:C.white }}>{t.label}</div>
                  <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>{t.tag}</div>
                </div>
                {templateNum === parseInt(n) && <div style={{ fontFamily:F.b, fontSize:11, color:t.color, fontWeight:700 }}>Selected</div>}
              </div>
            ))}
          </div>
        </div>

        {/* Mode toggle */}
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={()=>setBatchMode(false)}
            style={{ flex:1, padding:"8px", borderRadius:8, border:"1px solid "+(batchMode?C.panelLight:C.amber), background:batchMode?"transparent":C.amber+"22", color:batchMode?C.muted:C.amber, fontFamily:F.b, fontSize:12, fontWeight:700, cursor:"pointer" }}>
            Single Send
          </button>
          <button onClick={()=>setBatchMode(true)}
            style={{ flex:1, padding:"8px", borderRadius:8, border:"1px solid "+(batchMode?C.amber:C.panelLight), background:batchMode?C.amber+"22":"transparent", color:batchMode?C.amber:C.muted, fontFamily:F.b, fontSize:12, fontWeight:700, cursor:"pointer" }}>
            Batch Send (CSV)
          </button>
        </div>

        {!batchMode ? (
          /* Single send form */
          <div style={{ background:C.panel, borderRadius:12, border:"1px solid "+C.panelLight, padding:"16px 20px" }}>
            <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:12 }}>CONTACT DETAILS</div>
            <div style={{ display:"flex", gap:10, marginBottom:10 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:4 }}>FIRST NAME *</div>
                <input value={firstName} onChange={e=>{ setFirstName(e.target.value); setPreview(null); }}
                  placeholder="Mike" style={{ width:"100%", padding:"9px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:13, color:C.white, outline:"none", fontFamily:F.b, boxSizing:"border-box" }} />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:4 }}>LAST NAME</div>
                <input value={lastName} onChange={e=>setLastName(e.target.value)}
                  placeholder="Johnson" style={{ width:"100%", padding:"9px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:13, color:C.white, outline:"none", fontFamily:F.b, boxSizing:"border-box" }} />
              </div>
            </div>
            <div style={{ marginBottom:10 }}>
              <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:4 }}>EMAIL *</div>
              <input value={email} onChange={e=>{ setEmail(e.target.value); setPreview(null); }} type="email"
                placeholder="mike@johnsonhvac.com" style={{ width:"100%", padding:"9px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:13, color:C.white, outline:"none", fontFamily:F.b, boxSizing:"border-box" }} />

              <div style={{ flex:1 }}>
                <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:4 }}>TRADE</div>
                <select value={trade} onChange={e=>{ setTrade(e.target.value); setPreview(null); }}
                  style={{ width:"100%", padding:"9px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:13, color:trade?C.white:C.muted, outline:"none", fontFamily:F.b, boxSizing:"border-box" }}>
                  <option value="">Select trade...</option>

              <div style={{ flex:1 }}>
                <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:4 }}>BUSINESS NAME</div>
                <input value={biz} onChange={e=>setBiz(e.target.value)}
                  placeholder="Johnson HVAC" style={{ width:"100%", padding:"9px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:13, color:C.white, outline:"none", fontFamily:F.b, boxSizing:"border-box" }} />
              </div>
            </div>
            {err && <div style={{ fontFamily:F.b, fontSize:12, color:C.red, marginBottom:8 }}>{err}</div>}
            {sent && <div style={{ fontFamily:F.b, fontSize:12, color:C.green, marginBottom:8 }}>✓ Sent: {sent}</div>}
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={getPreview} disabled={previewing}

                {previewing ? "Loading..." : "Preview →"}
              </button>
              <button onClick={sendEmail} disabled={sending}
                style={{ flex:2, padding:"10px", borderRadius:8, border:"none", background:C.amber, color:"white", fontFamily:F.b, fontSize:13, fontWeight:700, cursor:sending?"wait":"pointer", opacity:sending?.7:1 }}>
                {sending ? "Sending..." : "Send from jen@ →"}
              </button>
            </div>
          </div>
        ) : (
          /* Batch CSV form */
          <div style={{ background:C.panel, borderRadius:12, border:"1px solid "+C.panelLight, padding:"16px 20px" }}>
            <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:6 }}>PASTE CSV</div>
            <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginBottom:10 }}>Format: FirstName, LastName, Email, Trade, BusinessName (one per line)</div>
            <textarea value={batchCSV} onChange={e=>setBatchCSV(e.target.value)} rows={8}
              placeholder={"Mike,Johnson,mike@johnsonhvac.com,HVAC,Johnson HVAC\nSarah,Williams,sarah@williamspipes.com,Plumbing,Williams Plumbing"}
              style={{ width:"100%", padding:"10px 12px", background:C.navyDark, border:"1px solid "+C.panelLight, borderRadius:7, fontSize:12, color:C.white, outline:"none", fontFamily:"monospace", boxSizing:"border-box", resize:"vertical" }} />
            {err && <div style={{ fontFamily:F.b, fontSize:12, color:C.red, margin:"8px 0" }}>{err}</div>}
            {sent && <div style={{ fontFamily:F.b, fontSize:12, color:C.green, margin:"8px 0" }}>✓ {sent}</div>}
            {batchResults.length > 0 && (
              <div style={{ maxHeight:150, overflowY:"auto", margin:"8px 0" }}>
                {batchResults.map((r, i) => (
                  <div key={i} style={{ fontFamily:F.b, fontSize:11, color:r.status==="sent"?C.green:C.red, padding:"3px 0", borderBottom:"1px solid "+C.panelLight+"44" }}>
                    {r.status==="sent"?"✓":"✗"} {r.email} {r.name?"("+r.name+")":""} — {r.note}
                  </div>
                ))}
              </div>
            )}
            <button onClick={sendBatch} disabled={batchSending}
              style={{ width:"100%", padding:"10px", borderRadius:8, border:"none", background:C.amber, color:"white", fontFamily:F.b, fontSize:13, fontWeight:700, cursor:batchSending?"wait":"pointer", opacity:batchSending?.7:1, marginTop:8 }}>
              {batchSending ? "Sending batch... (" + batchResults.length + " done)" : "Send Batch from jen@ →"}
            </button>
          </div>

      </div>

      <div style={{ flex:"1 1 380px", display:"flex", flexDirection:"column", gap:14 }}>

        {/* Email preview */}
        <div style={{ background:C.panel, borderRadius:12, border:"1px solid "+C.panelLight, overflow:"hidden" }}>

            <div style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>From: Jen Voiselle &lt;jen@compassbizsolutions.com&gt;</div>
          </div>

            <div style={{ padding:"16px 20px" }}>
              <div style={{ fontFamily:F.b, fontSize:12, color:C.muted, marginBottom:4 }}>SUBJECT</div>
              <div style={{ fontFamily:F.b, fontSize:14, fontWeight:700, color:C.white, marginBottom:14 }}>{preview.subject}</div>
              <div style={{ fontFamily:F.b, fontSize:12, color:C.muted, marginBottom:6 }}>BODY</div>
              <pre style={{ fontFamily:F.b, fontSize:13, color:C.ghost, lineHeight:1.75, whiteSpace:"pre-wrap", wordBreak:"break-word" }}>{preview.body}</pre>
            </div>
          ) : (
            <div style={{ padding:"32px 20px", textAlign:"center" }}>
              <div style={{ fontFamily:F.b, fontSize:13, color:C.muted }}>Fill in contact details and click Preview →</div>

                <div key={i} style={{ display:"flex", gap:12, padding:"10px 20px", borderBottom:"1px solid "+C.panelLight+"44", alignItems:"flex-start" }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontFamily:F.b, fontSize:13, color:C.white, fontWeight:600 }}>
                      {entry.firstName} {entry.lastName} <span style={{ fontWeight:400, color:C.ghost }}>— {entry.toEmail}</span>
                    </div>
                    <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, marginTop:2 }}>
                      {entry.trade && <span style={{ marginRight:8, color:C.amber }}>{entry.trade}</span>}
                      Email {entry.templateNum} · {new Date(entry.sentAt).toLocaleDateString()} {new Date(entry.sentAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
                    </div>
                  </div>
                  <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.green, flexShrink:0, padding:"2px 8px", background:C.green+"22", borderRadius:99 }}>SENT</div>
                </div>
              ))}
            </div>
          )}
        </div>

      </div>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => sessionStorage.getItem("admin_token")||"");

  function login(t) { sessionStorage.setItem("admin_token", t); setToken(t); }

  if (!token) return <Login onLogin={login} />;
  return <Dashboard token={token} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
