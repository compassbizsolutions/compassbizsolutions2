<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass Business Solutions — Profit Leak Snapshot & FixKit</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F7F5F2; color: #1A2332; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #F0EFED; } ::-webkit-scrollbar-thumb { background: #C8D0DC; border-radius: 3px; }
    input, textarea, select { font-family: 'DM Sans', sans-serif; }
    button { font-family: 'DM Sans', sans-serif; cursor: pointer; }
    .tip-wrap { position: relative; display: inline-flex; align-items: center; }
    .tip-wrap .tip { display: none; position: absolute; top: 130%; left: 50%; transform: translateX(-50%); background: #1B2E4B; color: white; font-size: 12px; line-height: 1.5; padding: 8px 12px; border-radius: 8px; width: 220px; z-index: 999; font-family: 'DM Sans', sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,0.2); pointer-events: none; }
    .tip-wrap:hover .tip { display: block; }
    .tip-wrap .tip::after { content: ""; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-bottom-color: #1B2E4B; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  navy:"#1B2E4B",navyDark:"#111E31",navyLight:"#243A5E",
  amber:"#C8701A",amberLight:"#FDF3E7",
  red:"#B84C2E",redLight:"#FAE8E4",
  slate:"#3D6B9E",slateLight:"#E8EFF7",
  green:"#1E6B45",greenLight:"#E8F5EE",
  gold:"#A8782A",
  warm0:"#F7F5F2",warm1:"#F0EFED",warm2:"#E8E4DC",warm3:"#D8D4CD",
  white:"#FFFFFF",ink:"#1A2332",body:"#3E4E63",muted:"#6B7A90",ghost:"#A0ABBE",
};
const F = { d:"'Barlow Condensed', sans-serif", b:"'DM Sans', sans-serif" };

// ── FIELD DEFINITIONS ─────────────────────────────────────────────────────────
// intakeKey maps to the answer stored in customer.intake_answers
const FIELDS = {
  pricing_current_rate:      { label:"Current hourly rate",         intakeKey:"p1_rate",         help:"What you charge per hour or per job right now.",                                    prefix:"$" },
  pricing_loaded_cost:       { label:"Loaded cost per hour",        intakeKey:"e2_loaded_cost",  help:"Wages + taxes + benefits + insurance per tech per hour.",                          prefix:"$",suffix:"/hr" },
  pricing_markup_pct:        { label:"Materials markup %",          intakeKey:"m1_markup",       help:"% you add on top of materials cost. 25% on $100 part = bill $125.",               suffix:"%" },
  pricing_target_rate:       { label:"Target rate after fix",       intakeKey:null,              help:"Your minimum profitable rate after covering all costs + margin.",                  prefix:"$",suffix:"/hr" , target:true },
  sched_jobs_per_week:       { label:"Jobs per week",               intakeKey:"jobs",            help:"Average completed jobs in a normal week.",                                         suffix:" jobs" },
  sched_lost_per_week:       { label:"Lost slots per week",         intakeKey:"noshows",         help:"Jobs lost to no-shows, cancellations, or empty slots.",                            suffix:" slots" },
  sched_avg_job_value:       { label:"Average job value",           intakeKey:"invoice",         help:"Your typical invoice for a standard job.",                                         prefix:"$" },
  sched_fill_rate:           { label:"Slot fill rate %",            intakeKey:null,              help:"% of cancelled slots you successfully fill with another customer.",                suffix:"%" , target:true },
  emp_num_techs:             { label:"Number of techs",             intakeKey:"crew",            help:"Total field techs including yourself.",                                            suffix:" techs" },
  emp_loaded_cost:           { label:"Loaded cost per tech/hr",     intakeKey:"e2_loaded_cost",  help:"Full hourly cost: wages + taxes + benefits + insurance.",                          prefix:"$",suffix:"/hr" },
  emp_billable_pct:          { label:"Billable % per day",          intakeKey:null,              help:"What % of each tech's paid day is actually on a job.",                             suffix:"%" , target:true },
  emp_tardiness_hrs:         { label:"Hours lost to tardiness/wk",  intakeKey:null,              help:"Total hours lost across all trucks due to late starts each week.",                 suffix:" hrs" , target:true },
  rec_current_monthly:       { label:"Current monthly recurring",   intakeKey:"r2_agreement_detail", help:"Monthly revenue from maintenance plans or agreements right now.",              prefix:"$" },
  rec_plan_price:            { label:"Maintenance plan price/yr",   intakeKey:null,              help:"What you'll charge per year for your plan.",                                       prefix:"$" , target:true },
  rec_target_customers:      { label:"Customers to offer plan to",  intakeKey:null,              help:"How many existing customers you'll approach first.",                               suffix:" customers" , target:true },
  inv_close_rate:            { label:"Estimate close rate",         intakeKey:"i1_close",        help:"% of estimates that convert to paid jobs.",                                        suffix:"%" },
  inv_unbilled_per_job:      { label:"Avg unbilled extras/job",     intakeKey:null,              help:"Dollar value of work done beyond original scope not on invoice.",                  prefix:"$" , target:true },
  inv_change_order_threshold:{ label:"Change order threshold",      intakeKey:null,              help:"Jobs above this dollar amount need a signed change order before you proceed.",     prefix:"$" , target:true },
  cf_days_to_invoice:        { label:"Days job → invoice",          intakeKey:null,              help:"How many days after completing a job before you send the invoice.",                suffix:" days" , target:true },
  cf_days_to_pay:            { label:"Days invoice → payment",      intakeKey:null,              help:"How long customers typically take to pay after receiving the invoice.",            suffix:" days" , target:true },
  cf_outstanding_ar:         { label:"Outstanding receivables",     intakeKey:null,              help:"Total dollar value of all unpaid invoices right now.",                             prefix:"$" , target:true },
  cf_monthly_breakeven:      { label:"Monthly break-even",          intakeKey:"c2_breakeven",    help:"Minimum monthly revenue needed to cover all your costs.",                          prefix:"$" },
  churn_google_reviews:      { label:"Google reviews",              intakeKey:"ch4_reviews",     help:"Your current total number of Google reviews.",                                     suffix:" reviews" },
  churn_referral_pct:        { label:"% from referrals",            intakeKey:"ch7_referral_pct",help:"What portion of new customers come from referrals.",                              suffix:"%" },
  churn_repeat_rate:         { label:"Repeat customer rate",        intakeKey:null,              help:"% of customers who use you more than once.",                                       suffix:"%" , target:true },
  mat_weekly_spend:          { label:"Weekly materials spend",      intakeKey:null,              help:"Total spent on parts and materials across all jobs each week.",                    prefix:"$" , target:true },
  mat_current_markup:        { label:"Current markup %",            intakeKey:"m1_markup",       help:"Your current markup on materials. 0% = billing at cost.",                         suffix:"%" },
  mat_target_markup:         { label:"Target markup for trade",     intakeKey:null,              help:"Standard for your trade: Plumbing 20-35%, HVAC 15-30%, Electrical 15-25%.",      suffix:"%" , target:true },
  mat_shop_fee:              { label:"Shop supply fee per job",     intakeKey:null,              help:"Flat per-job fee for small consumables too small to line-item. Typically $15-$35.",prefix:"$" , target:true },
  admin_hours_pw:            { label:"Admin hours per week",        intakeKey:"a1_hours",        help:"Hours you personally spend on non-billable administrative work.",                  suffix:" hrs" },
  admin_billing_rate:        { label:"Your billing rate",           intakeKey:"p1_rate",         help:"Used to calculate the dollar cost of time spent on admin.",                       prefix:"$",suffix:"/hr" },
  admin_recoverable:         { label:"Recoverable hours/week",      intakeKey:null,              help:"Realistic estimate of admin hours you could eliminate or delegate.",              suffix:" hrs" , target:true },
  veh_num_trucks:            { label:"Number of trucks",            intakeKey:"trucks",          help:"Total vehicles in your fleet used for field work.",                               suffix:" trucks" },
  veh_parts_runs:            { label:"Parts runs/truck/week",       intakeKey:"v1_runs",         help:"Average unplanned trips to the supply house per truck per week.",                 suffix:" runs" },
  veh_monthly_cost:          { label:"Monthly cost per truck",      intakeKey:"v5_monthly_cost", help:"All-in monthly cost: payments + fuel + insurance + maintenance.",                 prefix:"$",suffix:"/mo" },
};

// Task text → relevant field IDs
const TRIGGERS = [
  { kw:["rate","pricing","price","markup","charge","hourly","break-even rate"],         fields:["pricing_current_rate","pricing_loaded_cost","pricing_markup_pct","pricing_target_rate"] },
  { kw:["schedule","cancellation","no-show","confirm","slot","appointment","fill"],      fields:["sched_jobs_per_week","sched_lost_per_week","sched_avg_job_value"] },
  { kw:["tech","employee","labor","crew","billable","tardiness","staff","onboard"],      fields:["emp_num_techs","emp_loaded_cost","emp_billable_pct"] },
  { kw:["maintenance plan","recurring","agreement","contract","monthly revenue"],        fields:["rec_current_monthly","rec_plan_price","rec_target_customers"] },
  { kw:["invoice","estimate","change order","scope","extra work","unbilled"],            fields:["inv_close_rate","inv_unbilled_per_job","inv_change_order_threshold"] },
  { kw:["cash","receivable","ar ","overdue","break-even","reserve","deposit","pay"],     fields:["cf_days_to_invoice","cf_days_to_pay","cf_outstanding_ar","cf_monthly_breakeven"] },
  { kw:["follow up","review","referral","churn","repeat customer","google"],             fields:["churn_google_reviews","churn_referral_pct","churn_repeat_rate"] },
  { kw:["material","parts","markup","shop supply","consumable"],                         fields:["mat_weekly_spend","mat_current_markup","mat_target_markup","mat_shop_fee"] },
  { kw:["admin","paperwork","invoicing software","automate","delegate","scheduling software"], fields:["admin_hours_pw","admin_billing_rate","admin_recoverable"] },
  { kw:["truck","fleet","parts run","restock","supply house","vehicle"],                 fields:["veh_num_trucks","veh_parts_runs","veh_monthly_cost"] },
];

function CompassLogo({ size = 40 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 80 80" fill="none" style={{ flexShrink: 0 }}>
      <circle cx="40" cy="40" r="39" fill="none" stroke="white" strokeWidth="2"/>
      <circle cx="40" cy="40" r="37" fill="#1B2E4B" stroke="#142236" strokeWidth="1"/>
      <circle cx="40" cy="40" r="27" stroke="#3D6B9E" strokeWidth="1.2" fill="none" strokeDasharray="5 4" opacity="0.7"/>
      <circle cx="40" cy="40" r="18" stroke="#C8701A" strokeWidth="1.2" fill="none" strokeDasharray="4 4" opacity="0.7"/>
      <circle cx="40" cy="40" r="10" stroke="#B84C2E" strokeWidth="1.2" fill="none" strokeDasharray="3 4" opacity="0.65"/>
      <line x1="40" y1="3" x2="40" y2="10" stroke="rgba(255,255,255,0.3)" strokeWidth="1"/>
      <line x1="40" y1="70" x2="40" y2="77" stroke="rgba(255,255,255,0.3)" strokeWidth="1"/>
      <line x1="3" y1="40" x2="10" y2="40" stroke="rgba(255,255,255,0.3)" strokeWidth="1"/>
      <line x1="70" y1="40" x2="77" y2="40" stroke="rgba(255,255,255,0.3)" strokeWidth="1"/>
      <polygon points="40,7 42.5,36 40,40 37.5,36" fill="white" opacity="0.95"/>
      <polygon points="40,73 37.5,44 40,40 42.5,44" fill="white" opacity="0.35"/>
      <polygon points="73,40 44,42.5 40,40 44,37.5" fill="white" opacity="0.35"/>
      <polygon points="7,40 36,37.5 40,40 36,42.5" fill="white" opacity="0.95"/>
      <circle cx="40" cy="40" r="3.5" fill="white" opacity="0.9"/>
      <circle cx="40" cy="7" r="2.5" fill="#C8701A" opacity="0.95"/>
    </svg>
  );
}

function fieldsForTask(task) {
  if (!task) return [];
  const lower = task.toLowerCase();
  const found = new Set();
  TRIGGERS.forEach(t => { if (t.kw.some(k => lower.includes(k))) t.fields.forEach(f => found.add(f)); });
  return [...found].slice(0, 4);
}

function prefill(fieldId, intakeAnswers) {
  const f = FIELDS[fieldId];
  if (!f || !f.intakeKey || !intakeAnswers) return "";
  return intakeAnswers[f.intakeKey] || "";
}

// ── API ────────────────────────────────────────────────────────────────────────
async function api(path, method, body, token) {
  const h = { "Content-Type":"application/json" };
  if (token) h["Authorization"] = "Bearer " + token;
  const r = await fetch("/api/" + path, { method:method||"GET", headers:h, body:body?JSON.stringify(body):undefined });
  return r.json();
}

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
function Tip({ text }) {
  return (
    <span className="tip-wrap" style={{ marginLeft:5 }}>
      <span style={{ width:15,height:15,borderRadius:"50%",background:C.warm2,border:"1px solid "+C.warm3,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9,color:C.muted,fontWeight:700,cursor:"help" }}>?</span>
      <span className="tip">{text}</span>
    </span>
  );
}

// ── INLINE FIELD ──────────────────────────────────────────────────────────────
function InlineField({ fieldId, numbers, intakeAnswers, onChange }) {
  const f = FIELDS[fieldId];
  if (!f) return null;
  const pf = prefill(fieldId, intakeAnswers);
  const saved = numbers?.[fieldId];
  const val = saved !== undefined ? saved : (pf || "");
  const fromIntake = !saved && !!pf;
  const isTarget = !!f.target;
  const hasSavedTarget = isTarget && !!saved;

  // 3-tier color system:
  // BLUE  = from intake (where you are now)
  // AMBER = target field, not yet filled (what to change it to)
  // GREEN = target field, filled in (done — you set your target)
  const bg = fromIntake ? C.slateLight : hasSavedTarget ? C.greenLight : isTarget ? "#FFF8E1" : C.amberLight;
  const border = fromIntake ? C.slate+"33" : hasSavedTarget ? C.green+"44" : isTarget ? C.amber+"66" : C.amber+"33";
  const labelColor = fromIntake ? C.slate : hasSavedTarget ? C.green : isTarget ? C.amber : C.amber;
  const badge = fromIntake
    ? { text:"WHERE YOU ARE", bg:"white", color:C.slate, border:C.slate+"33" }
    : hasSavedTarget
    ? { text:"✓ TARGET SET", bg:C.green, color:"white", border:C.green }
    : isTarget
    ? { text:"← FILL THIS IN", bg:C.amber, color:"white", border:C.amber }
    : null;

  return (
    <div style={{ background:bg, border:"1px solid "+border, borderRadius:8, padding:"8px 10px", marginBottom:6 }}>
      <div style={{ display:"flex", alignItems:"center", marginBottom:4, gap:6 }}>
        <span style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:labelColor, flex:1 }}>{f.label}</span>
        <Tip text={f.help} />
        {badge && <span style={{ fontFamily:F.b, fontSize:9, fontWeight:700, color:badge.color, background:badge.bg, border:"1px solid "+badge.border, borderRadius:99, padding:"2px 7px", whiteSpace:"nowrap" }}>{badge.text}</span>}
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:4 }}>
        {f.prefix && <span style={{ fontFamily:F.b, fontSize:13, color:C.muted }}>{f.prefix}</span>}
        <input value={val} onChange={e=>onChange(fieldId,e.target.value)}
          placeholder={isTarget && !hasSavedTarget ? "Enter your target →" : "Enter value"}
          style={{ flex:1, padding:"5px 8px", border:"1px solid "+(fromIntake?C.slate+"33":isTarget&&!hasSavedTarget?C.amber+"66":C.warm3), borderRadius:6, fontSize:13, color:C.ink, fontFamily:F.b, background:"white", outline:"none", minWidth:0,
            fontWeight: hasSavedTarget ? 700 : 400 }} />
        {f.suffix && <span style={{ fontFamily:F.b, fontSize:12, color:C.muted, whiteSpace:"nowrap" }}>{f.suffix}</span>}
      </div>
    </div>
  );
}

// ── PASSWORD FIELD — defined outside Login to prevent remount on re-render ────
function PwField({ value, onChange, placeholder, showPw, onToggleShow, err }) {
  const pwS = { width:"100%", padding:"13px 16px", paddingRight:52, border:"2px solid "+(err?C.red:C.warm3), borderRadius:10, fontSize:15, color:C.ink, outline:"none", fontFamily:F.b, background:C.white, boxSizing:"border-box" };
  return (
    <div style={{ position:"relative" }}>
      <input value={value} onChange={e=>onChange(e.target.value)} type={showPw?"text":"password"} placeholder={placeholder||"Password"} style={pwS} />
      <button onClick={onToggleShow} type="button"
        style={{ position:"absolute", right:12, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", color:C.muted, fontSize:12, fontFamily:F.b, cursor:"pointer", padding:4 }}>
        {showPw?"Hide":"Show"}
      </button>
    </div>
  );
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function Login({ onLogin }) {
  // steps: "email" | "signin" | "create" | "forgot" | "reset" | "reset_sent"
  const [step, setStep] = useState("email");
  const [email, setEmail] = useState("");
  const [firstName, setFirstName] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [isSnapshot, setIsSnapshot] = useState(false);
  const [planType, setPlanType] = useState("");

  // Check URL for ?reset= token on mount
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get("reset");
    const resetEmail = params.get("email");
    if (resetToken && resetEmail) {
      setEmail(decodeURIComponent(resetEmail));
      setStep("reset");
      window.history.replaceState({}, "", "/");
    }
  }, []);

  function validatePw(pw) {
    if (!pw || pw.length < 8) return "At least 8 characters required.";
    if (!/\d/.test(pw)) return "Must include at least one number.";
    if (!/[^a-zA-Z0-9]/.test(pw)) return "Must include at least one special character (! @ # $ etc).";
    return null;
  }

  // Step 1 — check email, auto-route to signin or create
  async function handleEmailNext() {
    if (!email.trim() || !email.includes("@")) { setErr("Enter a valid email address."); return; }
    setLoading(true); setErr("");
    const r = await api("check-email", "POST", { email: email.trim() });
    setLoading(false);
    if (!r.exists) {
      setErr("No account found for this email. Make sure you're using the email you purchased with.");
      return;
    }
    setFirstName(r.name || "");
    const snap = r.plan_type === "snapshot";
    setIsSnapshot(snap);
    setPlanType(r.plan_type || "");
    if (r.hasPassword) setStep("signin");
    else setStep("create");
  }

  async function handleSignIn() {
    if (!password) { setErr("Enter your password."); return; }
    setLoading(true); setErr("");
    const r = await api("login", "POST", { email: email.trim(), password });
    setLoading(false);
    if (r.success) onLogin(r.token, r.customer);
    else setErr(r.error || "Incorrect password. Try again or reset below.");
  }

  async function handleCreate() {
    const pwErr = validatePw(password);
    if (pwErr) { setErr(pwErr); return; }
    if (password !== confirm) { setErr("Passwords don't match."); return; }
    setLoading(true); setErr("");
    const r = await api("set-password", "POST", { email: email.trim(), password });
    setLoading(false);
    if (r.success) onLogin(r.token, r.customer);
    else setErr(r.error || "Failed to set password. Try again.");
  }

  async function handleReset(otpToken) {
    const pwErr = validatePw(password);
    if (pwErr) { setErr(pwErr); return; }
    if (password !== confirm) { setErr("Passwords don't match."); return; }
    setLoading(true); setErr("");
    const r = await api("set-password", "POST", { email: email.trim(), password, otpToken });
    setLoading(false);
    if (r.success) onLogin(r.token, r.customer);
    else setErr(r.error || "Reset failed. Try again.");
  }

  async function handleForgot() {
    setLoading(true); setErr("");
    await api("send-reset", "POST", { email: email.trim() });
    setLoading(false);
    setStep("reset_sent");
  }

  const iS = { width:"100%", padding:"13px 16px", border:"2px solid "+(err?C.red:C.warm3), borderRadius:10, fontSize:15, color:C.ink, outline:"none", fontFamily:F.b, background:C.white, boxSizing:"border-box" };
  const pwHint = <div style={{ fontFamily:F.b, fontSize:11, color:C.muted, lineHeight:1.5, marginTop:6 }}>8+ characters · at least one number · at least one special character (! @ # $ % etc)</div>;

  const Header = ({ title, sub }) => (
    <>
      <div style={{ fontFamily:F.d, fontSize:24, fontWeight:800, color:C.ink, marginBottom:4 }}>{title}</div>
      {sub && <p style={{ fontSize:13, color:C.muted, lineHeight:1.6, marginBottom:20, fontFamily:F.b }}>{sub}</p>}
    </>
  );

  const BackBtn = ({ toStep, label }) => (
    <button onClick={()=>{ setStep(toStep); setErr(""); setPassword(""); setConfirm(""); }}
      style={{ width:"100%", marginTop:10, background:"none", border:"none", color:C.muted, fontSize:13, fontFamily:F.b, cursor:"pointer" }}>
      {label || "← Back"}
    </button>
  );

  const PrimaryBtn = ({ onClick, label, disabled }) => (
    <button onClick={onClick} disabled={disabled||loading}
      style={{ width:"100%", marginTop:16, background:C.amber, border:"none", color:"white", padding:"14px", borderRadius:10, fontSize:15, fontWeight:700, fontFamily:F.b, opacity:(disabled||loading)?.6:1, cursor:(disabled||loading)?"default":"pointer" }}>
      {loading ? "Please wait..." : label}
    </button>
  );

  return (
    <div style={{ minHeight:"100vh", background:C.navy, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ width:"100%", maxWidth:400 }}>

        {/* Logo + Title */}
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <CompassLogo size={68} />
          <div style={{ fontFamily:F.d, fontSize:28, fontWeight:800, color:C.white, letterSpacing:2, marginBottom:4 }}>
            {step === "email" ? "COMPASS BUSINESS SOLUTIONS" : planType === "snapshot" ? "PROFIT LEAK SNAPSHOT" : "PROFIT LEAK FIXKIT"}
          </div>
          <div style={{ fontSize:13, color:"rgba(255,255,255,0.4)", fontFamily:F.b }}>
            {step === "email" ? "Access your account" : planType === "snapshot" ? "Your DIY Profit Leak Report" : "Your Business Profit Repair System"}
          </div>
        </div>

        <div style={{ background:C.white, borderRadius:16, padding:"28px 24px", boxShadow:"0 24px 80px rgba(0,0,0,0.3)" }}>

          {/* ── STEP 1: EMAIL ── */}
          {step === "email" && <>
            <Header title="WELCOME" sub="Enter the email address you used when you purchased. We'll take it from there." />
            <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleEmailNext()}
              placeholder="your@email.com" type="email" autoFocus style={iS} />
            {err && <div style={{ color:C.red, fontSize:12, fontFamily:F.b, marginTop:8 }}>{err}</div>}
            <PrimaryBtn onClick={handleEmailNext} label="Continue →" />
          </>}

          {/* ── STEP 2A: RETURNING — SIGN IN ── */}
          {step === "signin" && <>
            <Header
              title={"WELCOME BACK" + (firstName ? ", " + firstName.toUpperCase() : "")}
              sub={"Signing in as " + email} />
            <PwField value={password} onChange={setPassword} placeholder="Your password"
              showPw={showPw} onToggleShow={()=>setShowPw(s=>!s)} err={err} />
            {err && <div style={{ color:C.red, fontSize:12, fontFamily:F.b, marginTop:8 }}>{err}</div>}
            <PrimaryBtn onClick={handleSignIn} label="Sign In →" />
            <div style={{ display:"flex", justifyContent:"space-between", marginTop:12 }}>
              <button onClick={()=>{ setStep("email"); setErr(""); setPassword(""); }}
                style={{ background:"none", border:"none", color:C.muted, fontSize:12, fontFamily:F.b, cursor:"pointer" }}>
                ← Different email
              </button>
              <button onClick={()=>{ setStep("forgot"); setErr(""); }}
                style={{ background:"none", border:"none", color:C.slate, fontSize:12, fontFamily:F.b, cursor:"pointer" }}>
                Forgot password?
              </button>
            </div>
          </>}

          {/* ── STEP 2B: NEW — CREATE PASSWORD ── */}
          {step === "create" && <>
            <Header
              title={"HI" + (firstName ? " " + firstName.toUpperCase() : "") + "! LET'S GET YOU SET UP"}
              sub={planType === "snapshot"
                ? "Create a password for your Snapshot account. You'll use this to access your report anytime."
                : "Create a password for your FixKit account. You'll use this every time you log in."} />
            <div style={{ marginBottom:12 }}>
              <PwField value={password} onChange={setPassword} placeholder="Create a password"
                showPw={showPw} onToggleShow={()=>setShowPw(s=>!s)} err={err} />
            </div>
            <PwField value={confirm} onChange={setConfirm} placeholder="Confirm your password"
              showPw={showPw} onToggleShow={()=>setShowPw(s=>!s)} err={err} />
            {pwHint}
            {err && <div style={{ color:C.red, fontSize:12, fontFamily:F.b, marginTop:8 }}>{err}</div>}
            <PrimaryBtn onClick={handleCreate} label={planType === "snapshot" ? "Create Password & Build My Snapshot →" : "Create Password & Continue →"} />
            <BackBtn toStep="email" label="← Different email" />
          </>}

          {/* ── RESET PASSWORD ── */}
          {step === "reset" && <>
            <Header title="SET NEW PASSWORD" sub={"Setting new password for " + email} />
            <div style={{ marginBottom:12 }}>
              <PwField value={password} onChange={setPassword} placeholder="New password"
                showPw={showPw} onToggleShow={()=>setShowPw(s=>!s)} err={err} />
            </div>
            <PwField value={confirm} onChange={setConfirm} placeholder="Confirm new password"
              showPw={showPw} onToggleShow={()=>setShowPw(s=>!s)} err={err} />
            {pwHint}
            {err && <div style={{ color:C.red, fontSize:12, fontFamily:F.b, marginTop:8 }}>{err}</div>}
            <PrimaryBtn onClick={handleReset} label="Set New Password →" />
          </>}

          {/* ── FORGOT PASSWORD ── */}
          {step === "forgot" && <>
            <Header title="RESET PASSWORD" sub={"We'll send a reset link to " + email} />
            {err && <div style={{ color:C.red, fontSize:12, fontFamily:F.b, marginBottom:8 }}>{err}</div>}
            <PrimaryBtn onClick={handleForgot} label="Send Reset Link →" />
            <BackBtn toStep="signin" label="← Back to sign in" />
          </>}

          {/* ── RESET SENT ── */}
          {step === "reset_sent" && <>
            <div style={{ textAlign:"center", padding:"10px 0" }}>
              <div style={{ fontSize:48, marginBottom:16 }}>📬</div>
              <div style={{ fontFamily:F.d, fontSize:22, fontWeight:800, color:C.ink, marginBottom:10 }}>CHECK YOUR EMAIL</div>
              <p style={{ fontSize:13, color:C.muted, lineHeight:1.7, fontFamily:F.b, marginBottom:24 }}>
                If that email has an account, a reset link is on its way. Check your inbox — it expires in 30 minutes.
              </p>
              <button onClick={()=>setStep("email")}
                style={{ background:"none", border:"none", color:C.slate, fontSize:13, fontFamily:F.b, cursor:"pointer" }}>
                ← Back to start
              </button>
            </div>
          </>}

        </div>
      </div>
    </div>
  );
}

// ── TASK CONTEXT — dynamic coaching block based on fields and actual numbers ──
function getTaskContext(flds, numbers, intakeAnswers, task) {
  if (!flds.length) return null;

  function val(id) {
    const f = FIELDS[id];
    if (!f) return null;
    const saved = numbers?.[id];
    const pf = f.intakeKey && intakeAnswers?.[f.intakeKey];
    const raw = saved || pf || "";
    return parseFloat(raw.toString().replace(/[^0-9.]/g,"")) || null;
  }

  function fmt(n) { return n ? "$" + Math.round(n).toLocaleString() : null; }

  // Pricing context
  if (flds.includes("pricing_current_rate") || flds.includes("pricing_target_rate")) {
    const current = val("pricing_current_rate");
    const loaded = val("pricing_loaded_cost");
    const target = val("pricing_target_rate");
    const overhead = 0.35; const profit = 0.20;
    const calcTarget = loaded ? Math.round((loaded / (1-overhead)) / (1-profit)) : null;
    const gap = current && calcTarget ? calcTarget - current : null;
    const annualGap = gap && gap > 0 ? fmt(gap * 1560) : null;

    return {
      objective: "OBJECTIVE: FIND YOUR MINIMUM PROFITABLE RATE",
      summary: loaded && current
        ? `Your loaded cost is ${fmt(loaded)}/hr — that's what each tech actually costs you before you make a dollar. At your current rate of ${fmt(current)}/hr, once you factor in overhead (est. 35%) and a 20% profit margin, your break-even rate is approximately ${fmt(calcTarget)}/hr.${gap > 0 ? ` You're currently ${fmt(gap)}/hr short — that's up to ${annualGap} in annual profit left on the table.` : " Your rate is covering your costs — great position."}`
        : "Your current rate and loaded cost are pre-filled from your intake. The goal of this task is to calculate what you actually need to charge to cover all costs and make a profit.",
      action: target
        ? `Your target rate is set to ${fmt(target)}/hr. Apply it to all new quotes going forward — don't grandfather existing customers unless they have active contracts.`
        : `Complete the task above, then use what you find to fill in the 🟡 Target Rate After Fix field below. Formula: (your loaded cost ÷ 0.65) × 1.20 = your minimum profitable rate. Or use the 🧮 Calculators tab for a full line-by-line breakdown.`,
      connection: `This number goes on every estimate and invoice from this point forward. Even a ${fmt(10)}/hr increase at 1,500 billable hours/year = $15,000 in additional profit with zero new customers.`,
      bridge: `After completing the task above → enter your result in the 🟡 yellow field${flds.filter(id=>FIELDS[id]?.target).length>1?"s":""} below.`
    };
  }

  // Scheduling context
  if (flds.includes("sched_lost_per_week") || flds.includes("sched_jobs_per_week")) {
    const lost = val("sched_lost_per_week");
    const avgJob = val("sched_avg_job_value");
    const annualLost = lost && avgJob ? fmt(lost * avgJob * 50) : null;

    return {
      objective: "OBJECTIVE: QUANTIFY AND RECOVER LOST SCHEDULING REVENUE",
      summary: lost && avgJob
        ? `You're losing approximately ${lost} job${lost !== 1 ? "s" : ""} per week to no-shows and cancellations. At your average job value of ${fmt(avgJob)}, that's ${fmt(lost * avgJob)}/week — or ${annualLost}/year — in revenue that evaporates with zero corresponding reduction in your fixed costs. Your trucks, insurance, and payroll all keep running whether those slots are filled or not.`
        : "Your no-show count and average job value are pre-filled from your intake. If they look off, update them — accurate numbers make the math real. The goal is to see exactly what empty slots cost you so you have a reason to fix them.",
      action: "This task is about building a same-day fill process. When a slot opens, you need to fill it within 2 hours. That means having a waitlist, a call script, and a text template ready before the next cancellation happens.",
      connection: "Every slot you fill that would have been empty is pure profit — your fixed costs are already paid. A 50% fill rate on your current cancellations could recover half that annual number with no new marketing spend.",
      bridge: "Complete the task above → then enter your results in the 🟡 yellow fields below."
    };
  }

  // Employee/labor context
  if (flds.includes("emp_loaded_cost") || flds.includes("emp_billable_pct")) {
    const loaded = val("emp_loaded_cost");
    const numTechs = val("emp_num_techs");
    const billable = val("emp_billable_pct");
    const nonBillableHrs = billable ? (1 - billable/100) * 8 : null;
    const dailyCost = loaded ? loaded * 8 : null;
    const nonBillableCost = dailyCost && billable ? dailyCost * (1 - billable/100) : null;

    return {
      objective: "OBJECTIVE: MEASURE AND REDUCE NON-BILLABLE LABOR COST",
      summary: loaded
        ? `Each tech costs you approximately ${fmt(loaded)}/hr all-in. An 8-hour paid day costs ${fmt(loaded * 8)} per tech.${billable ? ` At ${billable}% billable, ${nonBillableHrs?.toFixed(1)} hours per day per tech are paid but not billing — that's ${fmt(nonBillableCost)}/day per tech in labor cost with no revenue attached.` : " The goal is to measure how many of those paid hours are actually on a job and billing."}`
        : "Your loaded cost and tech count are pre-filled from your intake. Loaded cost = wages + payroll taxes + workers comp + benefits. If the number looks low, it's probably missing insurance — check your policy declarations.",
      action: "Track one tech for one full week: log start time, first job on-site time, last job off time, and end time. The gap between paid hours and billed hours is your non-billable percentage. That's what you're fixing.",
      connection: `Every percentage point of billable improvement across ${numTechs || "your"} tech${numTechs !== 1 ? "s" : ""} translates directly to profit — you're already paying for those hours. Getting from 65% to 75% billable is like getting a free tech for part of the week.`,
      bridge: "Use the weekly tracker above to log your hours, then enter your calculated billable % in the 🟡 yellow field below."
    };
  }

  // Cash flow / break-even context
  if (flds.includes("cf_monthly_breakeven") || flds.includes("cf_days_to_invoice")) {
    const breakeven = val("cf_monthly_breakeven");
    const daysToInvoice = val("cf_days_to_invoice");
    const daysToPay = val("cf_days_to_pay");
    const totalCycle = daysToInvoice && daysToPay ? daysToInvoice + daysToPay : null;

    return {
      objective: "OBJECTIVE: CLOSE THE GAP BETWEEN WORK DONE AND CASH IN HAND",
      summary: breakeven
        ? `Your break-even is ${fmt(breakeven)}/month — that's what you must bill before you make a dollar of profit.${totalCycle ? ` Right now, from the day you complete a job to the day you receive payment takes approximately ${totalCycle} days. Every day of that cycle is money you've earned sitting in someone else's account.` : " The goal is to understand how long it takes from completing a job to receiving payment — and shrink that window."}`
        : "Your break-even figure is pre-filled from your intake. If it's not there, estimate it: add up all monthly fixed costs (insurance, trucks, rent, payroll, software) and that's your floor. Every dollar above that is profit.",
      action: daysToInvoice && daysToInvoice > 1
        ? `You're waiting ${daysToInvoice} days to send invoices after completing jobs. Same-day invoicing is the single fastest way to improve cash flow with no other changes. Set a rule: invoice closes the same day the job closes.`
        : "Fill in your days-to-invoice and days-to-pay fields. Be honest — check your last 10 jobs and calculate the actual average. The number will motivate the fix.",
      connection: "Cutting invoice delay from 7 days to same-day on a $2,000 average job across 200 jobs/year means your money arrives 1,400 fewer days late total. That's the difference between floating payroll and having cash in reserve.",
      bridge: "Complete the task above → then enter your actual numbers in the 🟡 yellow fields below."
    };
  }

  // Materials context
  if (flds.includes("mat_current_markup") || flds.includes("mat_target_markup")) {
    const current = val("mat_current_markup");
    const target = val("mat_target_markup");
    const weekly = val("mat_weekly_spend");
    const weeklyGap = current && target && weekly
      ? (weekly * target/100) - (weekly * current/100) : null;

    return {
      objective: "OBJECTIVE: STOP BILLING MATERIALS AT COST",
      summary: current !== null
        ? `You're currently marking up materials ${current}%.${target ? ` Industry standard for your trade is ${target}%.` : ""} ${weekly && current !== null && target ? `On your weekly spend of ${fmt(weekly)}, that ${target - current}% difference = ${fmt(weeklyGap)}/week — or ${fmt(weeklyGap * 52)}/year — in revenue you're currently not capturing.` : " The goal is to find your actual markup and compare it to what's standard for your trade."}`
        : "Your current markup is pre-filled from your intake. If you said you don't mark up materials, that means you're billing them at cost — you're absorbing supplier pricing risk, delivery cost, and carrying cost with no compensation.",
      action: target
        ? `Your target markup is ${target}%. Apply it to every part on every invoice from this point forward. Update your invoicing template or pricing sheet with the new markup. If you use software, update the default markup percentage in settings.`
        : "Fill in your target markup using the industry benchmarks in the field tooltip. Start at the low end of your trade's range — that's the defensible minimum, not a stretch goal.",
      connection: "Materials markup isn't profit-taking — it's recovering real costs: storage, ordering time, delivery, risk of price changes. Every trade bills markup. If you're not, you're subsidizing your customers' parts costs.",
      bridge: "After researching your trade's standard markup → enter your target markup in the 🟡 yellow field below, then update it in your invoicing software."
    };
  }

  // Admin context
  if (flds.includes("admin_hours_pw") || flds.includes("admin_recoverable")) {
    const hrs = val("admin_hours_pw");
    const rate = val("admin_billing_rate");
    const annualCost = hrs && rate ? fmt(hrs * rate * 50) : null;

    return {
      objective: "OBJECTIVE: CALCULATE THE TRUE COST OF YOUR ADMIN TIME",
      summary: hrs && rate
        ? `You spend approximately ${hrs} hours per week on non-billable admin. At your billing rate of ${fmt(rate)}/hr, that's ${fmt(hrs * rate)}/week — or ${annualCost}/year — in time you're paying yourself to do work that doesn't generate revenue. That's not counting the cost of being pulled away from the field or from running the business.`
        : "Your admin hours are pre-filled from your intake. If you haven't tracked this, do it this week: every time you switch to an admin task, log the time. Most owners underestimate by 40%.",
      action: "This task is about identifying which admin tasks can be systematized, templated, or delegated. You don't need to hire someone — you need to build a process that reduces the time each task takes. Start with the one that eats the most time.",
      connection: "Every admin hour you recover is either an hour you can bill or an hour you get back. At your rate, recovering 5 hours/week = $25,000+/year in either billable time or owner sanity — both matter.",
      bridge: "Track your admin time this week → then enter the hours you realistically could recover in the 🟡 yellow field below."
    };
  }

  // Recurring revenue context
  if (flds.includes("rec_current_monthly") || flds.includes("rec_plan_price")) {
    const current = val("rec_current_monthly");
    const planPrice = val("rec_plan_price");
    const targets = val("rec_target_customers");
    const potential = planPrice && targets ? fmt((planPrice/12) * targets) : null;

    return {
      objective: "OBJECTIVE: BUILD PREDICTABLE MONTHLY REVENUE",
      summary: current !== null
        ? `You currently have ${fmt(current)}/month in predictable recurring revenue.${potential ? ` If you convert ${targets} existing customers to your maintenance plan at ${fmt(planPrice)}/year, that adds ${potential}/month in revenue you can count on before the month starts.` : " The goal is to convert a portion of your existing customer base to recurring agreements — people who already trust you and have paid you before."}`
        : "Your current recurring revenue is pre-filled from your intake. Even if it's zero, that's the starting point. Recurring revenue is the single biggest leverage point for a service business — it smooths cash flow, reduces marketing cost, and increases business value.",
      action: planPrice
        ? `Price your plan at ${fmt(planPrice)}/year. The pitch happens at job completion when the customer is happiest. Script: "We offer a maintenance plan that covers your annual [service] for ${fmt(planPrice)} — no surprise calls, priority scheduling, and we catch issues before they become expensive. Want me to set that up for you today?"`
        : "Fill in your plan price using the calculator in the 🧮 Calculators tab. Price it to cover 2 visits + parts allowance + a small premium for priority access. Don't underprice it.",
      connection: "10 maintenance agreements at $400/year = $4,000 in revenue you know is coming. 50 agreements = $20,000. This revenue exists whether you have a slow week or a great one.",
      bridge: "Set your plan price and target customer count → enter both in the 🟡 yellow fields below before you mark this day complete."
    };
  }

  // Default — generic but still useful
  return {
    objective: "OBJECTIVE: CAPTURE THE NUMBERS FOR THIS TASK",
    summary: "The fields below are pre-filled where possible from your intake answers. Review them for accuracy — if a number has changed since you answered the intake, update it here. These figures feed into your plan calculations.",
    action: "Fill in any empty fields using the guidance in the ? tooltip next to each label. Be as accurate as possible — the more precise your numbers, the more useful your plan results.",
    connection: "All numbers you enter here are saved automatically and visible in your 📊 Numbers tab for reference.",
      bridge: "Complete the task above → then enter your results in the fields below."
  };
}

// Detect which tracker type a task needs based on keywords
function getTrackerType(task) {
  if (!task) return null;
  const t = task.toLowerCase();
  if (t.includes("track") && (t.includes("week") || t.includes("daily") || t.includes("each day") || t.includes("per day"))) return "weekly_log";
  if (t.includes("checklist") || t.includes("check list") || t.includes("audit") || t.includes("inventory")) return "checklist";
  if (t.includes("call") && t.includes("customer") && t.includes("last")) return "call_log";
  if (t.includes("invoice") && (t.includes("review") || t.includes("audit") || t.includes("last"))) return "invoice_review";
  if (t.includes("parts run") || t.includes("supply run") || t.includes("parts runs")) return "parts_tracker";
  return null;
}

// Stable tracker input component
function TrackerInput({ value, onChange, placeholder, width }) {
  return (
    <input value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""}
      style={{ width:width||60, padding:"6px 8px", border:"1px solid "+C.warm3, borderRadius:6, fontSize:12, fontFamily:F.b, color:C.ink, outline:"none", textAlign:"center", background:C.white }} />
  );
}

function WeeklyLogTracker({ taskId, numbers, onSaveNum, fields }) {
  const days = ["Mon","Tue","Wed","Thu","Fri"];
  const f1 = fields[0] || { label:"Hours", key:"hrs1" };
  const f2 = fields[1] || null;

  function getVal(day, fkey) {
    return numbers?.["tracker_"+taskId+"_"+day+"_"+fkey] || "";
  }
  function setVal(day, fkey, val) {
    onSaveNum("tracker_"+taskId+"_"+day+"_"+fkey, val);
  }

  // Calculate totals
  const total1 = days.reduce((sum, d) => sum + (parseFloat(getVal(d, f1.key))||0), 0);
  const total2 = f2 ? days.reduce((sum, d) => sum + (parseFloat(getVal(d, f2.key))||0), 0) : 0;
  const pct = f2 && total2 > 0 ? Math.round((total1/total2)*100) : null;

  return (
    <div style={{ background:C.warm1, borderRadius:10, padding:"12px 14px", marginTop:10 }}>
      <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:10 }}>WEEKLY TRACKER</div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", minWidth:280 }}>
          <thead>
            <tr>
              <th style={{ fontFamily:F.b, fontSize:10, color:C.muted, padding:"4px 8px", textAlign:"left", fontWeight:700 }}>DAY</th>
              <th style={{ fontFamily:F.b, fontSize:10, color:C.muted, padding:"4px 8px", textAlign:"center", fontWeight:700 }}>{f1.label}</th>
              {f2 && <th style={{ fontFamily:F.b, fontSize:10, color:C.muted, padding:"4px 8px", textAlign:"center", fontWeight:700 }}>{f2.label}</th>}
              {f2 && <th style={{ fontFamily:F.b, fontSize:10, color:C.muted, padding:"4px 8px", textAlign:"center", fontWeight:700 }}>%</th>}
            </tr>
          </thead>
          <tbody>
            {days.map(day => {
              const v1 = getVal(day, f1.key);
              const v2 = f2 ? getVal(day, f2.key) : null;
              const dayPct = f2 && parseFloat(v2) > 0 ? Math.round((parseFloat(v1)||0)/(parseFloat(v2))*100) : null;
              return (
                <tr key={day}>
                  <td style={{ fontFamily:F.b, fontSize:12, fontWeight:700, color:C.body, padding:"4px 8px" }}>{day}</td>
                  <td style={{ padding:"4px 8px", textAlign:"center" }}>
                    <TrackerInput value={v1} onChange={val=>setVal(day, f1.key, val)} placeholder="0" />
                  </td>
                  {f2 && <td style={{ padding:"4px 8px", textAlign:"center" }}>
                    <TrackerInput value={v2} onChange={val=>setVal(day, f2.key, val)} placeholder="0" />
                  </td>}
                  {f2 && <td style={{ fontFamily:F.b, fontSize:12, color:dayPct>=65?C.green:dayPct?C.red:C.ghost, padding:"4px 8px", textAlign:"center", fontWeight:700 }}>
                    {dayPct !== null ? dayPct+"%" : "—"}
                  </td>}
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr style={{ borderTop:"2px solid "+C.warm3 }}>
              <td style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.ink, padding:"6px 8px" }}>TOTAL</td>
              <td style={{ fontFamily:F.b, fontSize:12, fontWeight:700, color:C.ink, padding:"6px 8px", textAlign:"center" }}>{total1.toFixed(1)}</td>
              {f2 && <td style={{ fontFamily:F.b, fontSize:12, fontWeight:700, color:C.ink, padding:"6px 8px", textAlign:"center" }}>{total2.toFixed(1)}</td>}
              {f2 && <td style={{ fontFamily:F.b, fontSize:13, fontWeight:800, color:pct>=65?C.green:pct?C.red:C.ghost, padding:"6px 8px", textAlign:"center" }}>
                {pct !== null ? pct+"%" : "—"}
              </td>}
            </tr>
          </tfoot>
        </table>
      </div>
      {f2 && pct !== null && (
        <div style={{ marginTop:8, fontFamily:F.b, fontSize:12, color:pct>=65?C.green:C.red, fontWeight:600 }}>
          {pct>=75 ? "✓ Strong — above 75% target" : pct>=65 ? "✓ Acceptable — at minimum target" : "⚠ Below 65% target — this is a significant leak"}
        </div>
      )}
    </div>
  );
}

function ChecklistTracker({ taskId, items, numbers, onSaveNum }) {
  function isChecked(item) { return numbers?.["chk_"+taskId+"_"+item.replace(/\s/g,"_")] === "1"; }
  function toggle(item) { onSaveNum("chk_"+taskId+"_"+item.replace(/\s/g,"_"), isChecked(item) ? "0" : "1"); }
  const done = items.filter(i => isChecked(i)).length;

  return (
    <div style={{ background:C.warm1, borderRadius:10, padding:"12px 14px", marginTop:10 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
        <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5 }}>CHECKLIST</div>
        <div style={{ fontFamily:F.b, fontSize:11, color:done===items.length?C.green:C.amber }}>{done}/{items.length} complete</div>
      </div>
      {items.map(item => (
        <div key={item} onClick={()=>toggle(item)}
          style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 10px", background:isChecked(item)?C.greenLight:C.white, borderRadius:8, marginBottom:6, cursor:"pointer", border:"1px solid "+(isChecked(item)?C.green+"33":C.warm3) }}>
          <div style={{ width:20, height:20, borderRadius:4, background:isChecked(item)?C.green:C.white, border:"2px solid "+(isChecked(item)?C.green:C.warm3), display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
            {isChecked(item) && <span style={{ color:"white", fontSize:12, fontWeight:700 }}>✓</span>}
          </div>
          <span style={{ fontFamily:F.b, fontSize:13, color:isChecked(item)?C.green:C.body, textDecoration:isChecked(item)?"line-through":"none", opacity:isChecked(item)?.6:1 }}>{item}</span>
        </div>
      ))}
    </div>
  );
}

function PartsRunTracker({ taskId, numbers, onSaveNum }) {
  const days = ["Mon","Tue","Wed","Thu","Fri"];
  function getVal(day) { return numbers?.["parts_"+taskId+"_"+day] || ""; }
  function setVal(day, val) { onSaveNum("parts_"+taskId+"_"+day, val); }
  const total = days.reduce((sum, d) => sum + (parseFloat(getVal(d))||0), 0);

  return (
    <div style={{ background:C.warm1, borderRadius:10, padding:"12px 14px", marginTop:10 }}>
      <div style={{ fontFamily:F.b, fontSize:10, fontWeight:700, color:C.muted, letterSpacing:1.5, marginBottom:10 }}>PARTS RUNS THIS WEEK — PER TRUCK</div>
      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
        {days.map(day => (
          <div key={day} style={{ textAlign:"center" }}>
            <div style={{ fontFamily:F.b, fontSize:10, color:C.muted, marginBottom:4 }}>{day}</div>
            <TrackerInput value={getVal(day)} onChange={val=>setVal(day, val)} placeholder="0" width={50} />
          </div>
        ))}
        <div style={{ textAlign:"center" }}>
          <div style={{ fontFamily:F.b, fontSize:10, color:C.ink, fontWeight:700, marginBottom:4 }}>TOTAL</div>
          <div style={{ width:50, padding:"6px 8px", background:total>5?C.redLight:total>2?C.amberLight:C.greenLight, borderRadius:6, fontFamily:F.b, fontSize:12, fontWeight:700, color:total>5?C.red:total>2?C.amber:C.green, textAlign:"center" }}>{total}</div>
        </div>
      </div>
      <div style={{ marginTop:8, fontFamily:F.b, fontSize:11, color:C.muted }}>
        Target: 0-1 per truck per week. {total>5?"This is a major leak — each run costs 1-2 billable hours.":total>2?"Above target — worth addressing.":"Good — keep it there."}
      </div>
    </div>
  );
}

// Map task keywords to specific tracker configs
function getTracker(task, taskId, numbers, onSaveNum) {
  if (!task) return null;
  const t = task.toLowerCase();

  if ((t.includes("track") || t.includes("log") || t.includes("measure")) && (t.includes("billable") || t.includes("non-billable"))) {
    return <WeeklyLogTracker taskId={taskId} numbers={numbers} onSaveNum={onSaveNum}
      fields={[{label:"Billable hrs", key:"billable"},{label:"Paid hrs", key:"paid"}]} />;
  }
  if (t.includes("parts run") || t.includes("supply run") || t.includes("unplanned run")) {
    return <PartsRunTracker taskId={taskId} numbers={numbers} onSaveNum={onSaveNum} />;
  }
  if (t.includes("truck stock") || t.includes("truck restock") || t.includes("restock")) {
    return <ChecklistTracker taskId={taskId} numbers={numbers} onSaveNum={onSaveNum} items={[
      "Check common parts inventory","Restock consumables (tape, fittings, wire nuts)","Check tools — nothing missing or broken","Update truck stock sheet","Note anything to reorder"
    ]} />;
  }
  if (t.includes("invoice") && (t.includes("review") || t.includes("audit") || t.includes("last 10") || t.includes("last ten"))) {
    return <WeeklyLogTracker taskId={taskId} numbers={numbers} onSaveNum={onSaveNum}
      fields={[{label:"Days to invoice", key:"days_invoice"},{label:"Days to pay", key:"days_pay"}]} />;
  }
  if (t.includes("no-show") || t.includes("cancellation") && t.includes("track")) {
    return <WeeklyLogTracker taskId={taskId} numbers={numbers} onSaveNum={onSaveNum}
      fields={[{label:"Cancellations", key:"cancel"},{label:"Filled", key:"filled"}]} />;
  }
  if (t.includes("follow up") && t.includes("customer") && (t.includes("call") || t.includes("contact") || t.includes("reach"))) {
    return <ChecklistTracker taskId={taskId} numbers={numbers} onSaveNum={onSaveNum} items={[
      "Pulled list of customers from last 90 days","Called or texted top 10 customers","Asked for Google review from satisfied customers","Noted callbacks needed","Updated customer list with responses"
    ]} />;
  }
  if (t.includes("checklist") || t.includes("safety") && t.includes("check")) {
    return <ChecklistTracker taskId={taskId} numbers={numbers} onSaveNum={onSaveNum} items={[
      "PPE requirements documented","Job site hazard protocol written","Incident reporting process in place","All techs briefed on procedures","Posted in shop/truck"
    ]} />;
  }
  return null;
}

function n(v) { return parseFloat((v||"").toString().replace(/[^0-9.]/g,""))||0; }
function fmt(v) { return "$" + Math.round(v).toLocaleString(); }
function fmtD(v) { return "$" + v.toFixed(2); }

function PricingCalc({ numbers, onSaveNum, intakeAnswers }) {
  const [v, setV] = React.useState({
    wages: numbers?.calc_wages || intakeAnswers?.e2_loaded_cost || "",
    payroll_tax_pct: numbers?.calc_payroll_tax_pct || "7.65",
    workers_comp: numbers?.calc_workers_comp || "",
    health_benefits: numbers?.calc_health_benefits || "",
    liability_ins: numbers?.calc_liability_ins || "",
    other_overhead: numbers?.calc_other_overhead || "",
    billable_hrs_yr: numbers?.calc_billable_hrs_yr || "1560",
    overhead_pct: numbers?.calc_overhead_pct || "35",
    profit_pct: numbers?.calc_profit_pct || "20",
    current_rate: numbers?.pricing_current_rate || intakeAnswers?.p1_rate || "",
  });

  function upd(k, val) {
    const next = {...v, [k]:val};
    setV(next);
    onSaveNum("calc_"+k, val);
  }

  const wages = n(v.wages);
  const payrollTax = wages * (n(v.payroll_tax_pct)/100);
  const workersComp = n(v.workers_comp);
  const healthBen = n(v.health_benefits);
  const liabilityIns = n(v.liability_ins);
  const otherOverhead = n(v.other_overhead);
  const billableHrs = n(v.billable_hrs_yr) || 1560;
  const overheadPct = n(v.overhead_pct) || 35;
  const profitPct = n(v.profit_pct) || 20;

  const totalAnnualCost = wages + payrollTax + workersComp + healthBen + liabilityIns + otherOverhead;
  const loadedPerHr = billableHrs > 0 ? totalAnnualCost / billableHrs : 0;
  const withOverhead = loadedPerHr / (1 - overheadPct/100);
  const recommendedRate = withOverhead / (1 - profitPct/100);
  const currentRate = n(v.current_rate);
  const gap = recommendedRate - currentRate;
  const hasResult = totalAnnualCost > 0;

  return (
    <CalcSection title="💰 PRICING & LABOR RATE CALCULATOR" color={C.red}>
      <p style={{ fontFamily:F.b, fontSize:13, color:C.muted, lineHeight:1.6, marginBottom:16 }}>
        Fill in your actual numbers to calculate your true minimum profitable hourly rate. Pull wages from payroll records, insurance costs from your policy declarations pages.
      </p>

function MaterialsCalc({ numbers, onSaveNum, intakeAnswers }) {
  const [v, setV] = React.useState({
    weekly_spend: numbers?.calc_mat_weekly || "",
    current_markup: numbers?.mat_current_markup || intakeAnswers?.m1_markup || "",
    target_markup: numbers?.mat_target_markup || "",
    shop_fee: numbers?.mat_shop_fee || "",
    jobs_per_week: numbers?.sched_jobs_per_week || intakeAnswers?.jobs || "",
  });
  function upd(k, val) { setV(p=>({...p,[k]:val})); onSaveNum("calc_mat_"+k, val); }

  const weeklySpend = n(v.weekly_spend);
  const currentMarkup = n(v.current_markup)/100;
  const targetMarkup = n(v.target_markup)/100;
  const shopFee = n(v.shop_fee);
  const jobsPerWeek = n(v.jobs_per_week);

  const currentWeeklyRevFromMat = weeklySpend * (1 + currentMarkup);
  const targetWeeklyRevFromMat = weeklySpend * (1 + targetMarkup);
  const weeklyGap = targetWeeklyRevFromMat - currentWeeklyRevFromMat;
  const annualGap = weeklyGap * 52;
  const shopFeeAnnual = shopFee * jobsPerWeek * 52;
  const hasResult = weeklySpend > 0 && targetMarkup > 0;

  return (
    <CalcSection title="🔧 MATERIALS MARKUP CALCULATOR" color={C.amber}>
      <p style={{ fontFamily:F.b, fontSize:13, color:C.muted, lineHeight:1.6, marginBottom:16 }}>
        Calculate what you're currently leaving on the table with materials and what you should be charging. Pull receipts from your last 4 weeks of supply house visits.
      </p>
      <CalcInput label="Weekly materials spend (what YOU pay)" help="Add up your last 4 weeks of supply house receipts or credit card statements for parts/materials. Divide by 4. This is your cost — not what you bill." value={v.weekly_spend} onChange={val=>upd("weekly_spend",val)} prefix="$" suffix="/wk" />
      <CalcInput label="Current markup %" help="Formula: pick any invoice with parts. (Amount billed for part - amount you paid) ÷ amount you paid × 100. Example: billed $115, paid $85 = $30÷$85 = 35%. If you bill at cost, enter 0." value={v.current_markup} onChange={val=>upd("current_markup",val)} suffix="%" />
      <CalcInput label="Target markup % for your trade" help="Industry minimums: HVAC 15-30% | Plumbing 20-35% | Electrical 15-25% | Air Duct/Cleaning 20-30% | Appliance 25-40% | General 20-35%. Use the low end of your range as your minimum target." value={v.target_markup} onChange={val=>upd("target_markup",val)} suffix="%" />
      <CalcInput label="Jobs per week" help="Average number of completed jobs per week. Count from your last month of invoices and divide by 4." value={v.jobs_per_week} onChange={val=>upd("jobs_per_week",val)} suffix=" jobs" />
      <CalcInput label="Shop supply fee per job (optional)" help="A flat per-job charge for small consumables — tape, wire nuts, fittings too small to line-item. Typical range: $15-$35 per job. This adds up significantly at volume." value={v.shop_fee} onChange={val=>upd("shop_fee",val)} prefix="$" suffix="/job" />

      {hasResult && <>
        <CalcResult label="ANNUAL REVENUE GAP FROM MARKUP DIFFERENCE" value={fmt(annualGap)} sub={"You're leaving " + fmt(weeklyGap) + "/week on the table vs your target markup"} color={weeklyGap > 0 ? C.red : C.green} />
        {shopFee > 0 && jobsPerWeek > 0 && <CalcResult label="SHOP FEE ANNUAL REVENUE" value={fmt(shopFeeAnnual)} sub={"Adding a shop fee captures " + fmt(shopFeeAnnual) + "/yr you're currently giving away"} color={C.amber} />}
      </>}
    </CalcSection>
  );
}

function SchedulingCalc({ numbers, onSaveNum, intakeAnswers }) {
  const [v, setV] = React.useState({
    jobs_per_week: numbers?.sched_jobs_per_week || intakeAnswers?.jobs || "",
    avg_job_value: numbers?.sched_avg_job_value || intakeAnswers?.invoice || "",
    noshows_per_week: numbers?.sched_lost_per_week || intakeAnswers?.noshows || "",
    fill_rate: numbers?.sched_fill_rate || "30",
    cancellation_notice: numbers?.calc_sched_notice || "",
    weeks_per_year: numbers?.calc_sched_weeks || "50",
  });
  function upd(k, val) { setV(p=>({...p,[k]:val})); onSaveNum("calc_sched_"+k, val); }

  const jobsPerWeek = n(v.jobs_per_week);
  const avgJobValue = n(v.avg_job_value);
  const noshows = n(v.noshows_per_week);
  const fillRate = n(v.fill_rate)/100;
  const weeksPerYear = n(v.weeks_per_year)||50;

  const unfilledPerWeek = noshows * (1 - fillRate);
  const weeklyLost = unfilledPerWeek * avgJobValue;
  const annualLost = weeklyLost * weeksPerYear;
  const capacityPct = jobsPerWeek > 0 ? Math.round((noshows/jobsPerWeek)*100) : 0;
  const hasResult = noshows > 0 && avgJobValue > 0;

  return (
    <CalcSection title="📅 SCHEDULING & LOST REVENUE CALCULATOR" color="#9B59B6">
      <p style={{ fontFamily:F.b, fontSize:13, color:C.muted, lineHeight:1.6, marginBottom:16 }}>
        Calculate how much revenue you're losing to no-shows and unfilled slots. Check your calendar or call log for the last 30 days to get accurate numbers.
      </p>
      <CalcInput label="Jobs completed per week (average)" help="Count completed jobs from your last 4 weeks of invoices and divide by 4. Include service calls, installs, and maintenance. Don't count estimates." value={v.jobs_per_week} onChange={val=>upd("jobs_per_week",val)} suffix=" jobs/wk" />
      <CalcInput label="Average job value (labor + parts)" help="Add your last 20 invoices and divide by 20. Include everything billed — labor AND parts. Run a sales report in your software or manually total your invoices." value={v.avg_job_value} onChange={val=>upd("avg_job_value",val)} prefix="$" />
      <CalcInput label="No-shows / cancellations per week" help="Check your calendar or scheduling software for the last 30 days. Count every appointment that cancelled or no-showed. Divide by 4 weeks." value={v.noshows_per_week} onChange={val=>upd("noshows_per_week",val)} suffix=" per wk" />
      <CalcInput label="% of cancellations you successfully fill" help="Of your last 10 cancellations, how many did you fill with another paying job? Count filled ÷ 10 × 100. If you have no fill process, enter 0." value={v.fill_rate} onChange={val=>upd("fill_rate",val)} suffix="%" />
      <CalcInput label="Weeks worked per year" help="52 weeks minus vacation, holidays, slow season. Most trades: 48-50 working weeks. Adjust for your business." value={v.weeks_per_year} onChange={val=>upd("weeks_per_year",val)} suffix=" weeks/yr" />

      {hasResult && <>
        {jobsPerWeek > 0 && <div style={{ background:C.warm1, borderRadius:8, padding:"10px 14px", margin:"12px 0", fontFamily:F.b, fontSize:12, color:C.body }}>
          No-shows represent <strong style={{color:C.ink}}>{capacityPct}%</strong> of your weekly capacity — that's {unfilledPerWeek.toFixed(1)} unfilled slots per week after your fill rate.
        </div>}
        <CalcResult label="WEEKLY REVENUE LOST TO UNFILLED SLOTS" value={fmt(weeklyLost)} sub={unfilledPerWeek.toFixed(1) + " unfilled slots/wk × " + fmt(avgJobValue) + " avg job value"} color="#9B59B6" />
        <CalcResult label="ANNUAL REVENUE LOST" value={fmt(annualLost)} sub={"Over " + weeksPerYear + " working weeks — this is recoverable with a waitlist and fill process"} color={C.red} />
      </>}
    </CalcSection>
  );
}

function EmployeeCalc({ numbers, onSaveNum, intakeAnswers }) {
  const [v, setV] = React.useState({
    num_techs: numbers?.emp_num_techs || intakeAnswers?.crew || "",
    wages_per_tech: numbers?.calc_emp_wages || "",
    payroll_tax_pct: numbers?.calc_emp_tax || "7.65",
    workers_comp: numbers?.calc_emp_wc || "",
    health_benefits: numbers?.calc_emp_benefits || "",
    paid_hrs_per_day: numbers?.calc_emp_paid_hrs || "8",
    billable_hrs_per_day: numbers?.calc_emp_billable || "",
    avg_job_value: numbers?.sched_avg_job_value || intakeAnswers?.invoice || "",
    tardy_mins_per_day: numbers?.calc_emp_tardy || "",
  });
  function upd(k, val) { setV(p=>({...p,[k]:val})); onSaveNum("calc_emp_"+k, val); }

  const numTechs = n(v.num_techs)||1;
  const wages = n(v.wages_per_tech);
  const payrollTax = wages * (n(v.payroll_tax_pct)/100);
  const wc = n(v.workers_comp);
  const benefits = n(v.health_benefits);
  const totalAnnual = (wages + payrollTax + wc + benefits) * numTechs;
  const paidHrs = n(v.paid_hrs_per_day)||8;
  const billableHrs = n(v.billable_hrs_per_day);
  const billablePct = paidHrs > 0 && billableHrs > 0 ? (billableHrs/paidHrs)*100 : 0;
  const nonBillableHrs = paidHrs - billableHrs;
  const dailyCostPerTech = wages > 0 ? (wages/260) : 0;
  const dailyNonBillableCost = dailyCostPerTech * (nonBillableHrs/paidHrs);
  const annualNonBillableCost = dailyNonBillableCost * 260 * numTechs;
  const tardyMins = n(v.tardy_mins_per_day);
  const annualTardyCost = tardyMins > 0 ? (dailyCostPerTech * (tardyMins/480)) * 260 * numTechs : 0;
  const hasResult = wages > 0 && billableHrs > 0;

  return (
    <CalcSection title="👷 EMPLOYEE COST & BILLABLE HOURS CALCULATOR" color={C.gold}>
      <p style={{ fontFamily:F.b, fontSize:13, color:C.muted, lineHeight:1.6, marginBottom:16 }}>
        Calculate your true cost per billable hour and what non-billable time is costing you. Pull from payroll records and track one tech for one week to get accurate billable hours.
      </p>

      <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.gold, letterSpacing:1.5, marginBottom:10 }}>WORKFORCE COSTS</div>
      <CalcInput label="Number of field techs" help="Everyone who runs jobs — including yourself if you work in the field. Count part-timers as 0.5." value={v.num_techs} onChange={val=>upd("num_techs",val)} suffix=" techs" />
      <CalcInput label="Annual wages per tech (average)" help="Pull from your payroll records — gross annual wages per tech. Use the average if techs earn different amounts. Include your own owner draw if you work in the field." value={v.wages_per_tech} onChange={val=>upd("wages_per_tech",val)} prefix="$" suffix="/yr" />
      <CalcInput label="Payroll tax rate %" help="Federal payroll tax is 7.65%. Add your state rate. Most states add 1-4%. Check your state unemployment tax rate on your SUTA notices." value={v.payroll_tax_pct} onChange={val=>upd("payroll_tax_pct",val)} suffix="%" />
      <CalcInput label="Workers comp (annual per tech)" help="Total annual workers comp premium ÷ number of techs. Find on your policy declarations or annual audit letter." value={v.workers_comp} onChange={val=>upd("workers_comp",val)} prefix="$" suffix="/yr" />
      <CalcInput label="Health benefits (annual per tech)" help="Employer contribution to health insurance × 12 per tech. Check your benefits invoices." value={v.health_benefits} onChange={val=>upd("health_benefits",val)} prefix="$" suffix="/yr" />

      {wages > 0 && <div style={{ background:C.warm1, borderRadius:8, padding:"10px 14px", margin:"8px 0 16px", fontFamily:F.b, fontSize:12, color:C.body }}>
        Total annual workforce cost: <strong style={{color:C.ink}}>{fmt(totalAnnual)}</strong> across {numTechs} tech{numTechs>1?"s":""}
      </div>}

      <div style={{ fontFamily:F.b, fontSize:11, fontWeight:700, color:C.gold, letterSpacing:1.5, margin:"16px 0 10px" }}>BILLABLE HOURS ANALYSIS</div>
      <CalcInput label="Paid hours per day per tech" help="How many hours do you pay each tech per day? Most full-time = 8 hrs. Track one tech for one week to confirm." value={v.paid_hrs_per_day} onChange={val=>upd("paid_hrs_per_day",val)} suffix=" hrs/day" />
      <CalcInput label="Actual billable hours per day per tech" help="Track one tech for one full week — count only hours where they were on a job and billing the customer. Don't count drive time, supply runs, or idle time. Divide weekly billable hours by 5." value={v.billable_hrs_per_day} onChange={val=>upd("billable_hrs_per_day",val)} suffix=" hrs/day" />
      <CalcInput label="Average minutes late per day per tech" help="For each tech, note their actual start time vs scheduled start for one week. Average the daily late minutes across the team. Be honest — this is for your eyes only." value={v.tardy_mins_per_day} onChange={val=>upd("tardy_mins_per_day",val)} suffix=" min/day" />

      {hasResult && <>
        <div style={{ background:C.warm1, borderRadius:8, padding:"10px 14px", margin:"12px 0", fontFamily:F.b, fontSize:12, color:C.body }}>
          Billable rate: <strong style={{color:billablePct<65?C.red:C.green}}>{billablePct.toFixed(0)}%</strong> — industry target is 65-75%. Each tech has {nonBillableHrs.toFixed(1)} non-billable hours per day.
        </div>
        <CalcResult label="ANNUAL COST OF NON-BILLABLE TIME" value={fmt(annualNonBillableCost)} sub={"Across " + numTechs + " tech" + (numTechs>1?"s":"") + " — time you're paying for but not billing"} color={C.red} />
        {tardyMins > 0 && <CalcResult label="ANNUAL COST OF TARDINESS" value={fmt(annualTardyCost)} sub={tardyMins + " min/day late × " + numTechs + " tech" + (numTechs>1?"s":"") + " × 260 days"} color={C.amber} />}
      </>}
    </CalcSection>
  );
}

function CustomerDashboard({ data }) {
  const completed = data?.progress?.completed || [];
  const days = data?.days || [];
  const customer = data?.customer || {};
  const isBundle = customer.is_bundle;
  const totalDays = isBundle ? 90 : 30;
  const pct = Math.round((completed.length / totalDays) * 100);
  const numbers = data?.savedNumbers || {};
  const intake = customer.intake_answers || {};

  function n(key, intakeKey) {
    const saved = numbers?.[key];
    const pf = intakeKey ? intake?.[intakeKey] : null;
    return parseFloat(((saved||pf||"0").toString()).replace(/[^0-9.]/g,""))||0;
  }
  function fmt(v) { return v > 0 ? "$"+Math.round(v).toLocaleString() : "—"; }
  function fmtR(v) { return v > 0 ? "$"+v.toFixed(2) : "—"; }

  // Before values (from intake)
  const beforeRate = parseFloat((intake?.p1_rate||"0").replace(/[^0-9.]/g,""))||0;
  const beforeLost = parseFloat((intake?.noshows||"0").replace(/[^0-9.]/g,""))||0;
  const beforeMarkup = parseFloat((intake?.m1_markup||"0").replace(/[^0-9.]/g,""))||0;
  const beforeAdmin = parseFloat((intake?.a1_hours||"0").replace(/[^0-9.]/g,""))||0;
  const beforeRecurring = parseFloat((intake?.r2_agreement_detail||"0").replace(/[^0-9.]/g,""))||0;

  // After values (from saved numbers)
  const afterRate = n("pricing_target_rate", null) || n("pricing_current_rate", "p1_rate");
  const afterLost = n("sched_lost_per_week", "noshows");
  const afterMarkup = n("mat_target_markup", null) || n("mat_current_markup", "m1_markup");
  const afterAdmin = n("admin_recoverable", null);
  const afterRecurring = n("rec_current_monthly", null);
  const avgJob = n("sched_avg_job_value", "invoice");
  const adminRate = n("admin_billing_rate", "p1_rate") || beforeRate;
  const weeklyMatSpend = n("mat_weekly_spend", null);

  // Impact calculations
  const pricingImpact = afterRate > beforeRate ? (afterRate - beforeRate) * 1560 : 0;
  const schedImpact = beforeLost > afterLost && afterLost >= 0 && avgJob > 0 ? (beforeLost - afterLost) * avgJob * 50 : (beforeLost * avgJob * 50 * 0.5); // assume 50% fill rate improvement if no after value
  const markupImpact = afterMarkup > beforeMarkup && weeklyMatSpend > 0 ? weeklyMatSpend * (afterMarkup - beforeMarkup) / 100 * 52 : 0;
  const adminImpact = afterAdmin > 0 && adminRate > 0 ? afterAdmin * adminRate * 50 : 0;
  const recurringImpact = afterRecurring > beforeRecurring ? (afterRecurring - beforeRecurring) * 12 : 0;

function getTag(text, tag) {
  // Stop only at next ALL-CAPS tag like [LEAK_1_NAME], not at fill-in brackets like [Your name here]
  const m = (text||"").match(new RegExp("\\[" + tag + "\\]([\\s\\S]*?)(?=\\n\\[[A-Z][A-Z_0-9]+\\]|$)"));
  return m ? m[1].trim() : "";
}
