<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Set Up Your Account — ReviewKit | Compass Business Solutions</title>
  <meta name="description" content="Tell ReviewKit about your business and how you want to sound in review replies."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F4F7FC;color:#1B2E4B;line-height:1.6}
    .nav{background:#1B2E4B;padding:16px 40px;display:flex;align-items:center;justify-content:space-between}
    .nav-logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:white;letter-spacing:1px;text-decoration:none}
    .nav-logo span{color:#C8701A}

    .wrap{max-width:560px;margin:0 auto;padding:56px 24px}
    h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px;text-align:center}
    .sub{font-size:14px;color:#5A7291;text-align:center;margin-bottom:32px}

    .card{background:white;border:1px solid #D8E4F0;border-radius:14px;padding:32px}
    label{display:block;font-size:13px;font-weight:700;color:#1B2E4B;margin:20px 0 6px}
    label:first-of-type{margin-top:0}
    .hint{font-size:12px;color:#5A7291;margin-top:-2px;margin-bottom:6px}
    input[type=text], select, textarea {
      width:100%;padding:11px 12px;border:1px solid #C8D6E8;border-radius:8px;font-size:14px;font-family:inherit;color:#1B2E4B;background:white;
    }
    input[type=text]:focus, select:focus, textarea:focus { outline:2px solid #C8701A; outline-offset:1px; border-color:#C8701A; }
    textarea{min-height:80px;resize:vertical}
    .tone-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .tone-option{border:1px solid #C8D6E8;border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#4A6070}
    .tone-option.selected{border-color:#C8701A;background:#FFF6EE;color:#1B2E4B}
    .tone-option input{display:none}

    .submit-btn{width:100%;margin-top:28px;background:#C8701A;color:white;border:none;padding:14px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer}
    .submit-btn:hover{opacity:0.9}
    .submit-btn:disabled{opacity:0.5;cursor:not-allowed}
    .error{background:#fff3bf;color:#7d5a00;border:1px solid #ffe066;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:16px;display:none}
    .loading{text-align:center;color:#5A7291;font-size:14px;padding:40px 0}
  </style>
</head>
<body>
  <div class="nav">
    <a href="/" class="nav-logo">COMPASS <span>BIZ SOLUTIONS</span></a>
  </div>
  <div class="wrap">
    <h1>Set up your account</h1>
    <p class="sub">Just a couple of things so ReviewKit sounds like you, not a robot.</p>

    <div id="loading" class="loading">Loading your account…</div>

    <form id="onboarding-form" class="card" style="display:none">
      <input type="hidden" id="businessId" />

      <label for="businessName">Business name</label>
      <input type="text" id="businessName" placeholder="e.g. Grub's Tubs Pool Service" required />

      <label>How should replies sound?</label>
      <div class="tone-options" id="tone-options">
        <label class="tone-option selected" data-value="friendly">
          <input type="radio" name="tone" value="friendly" checked /> Friendly
        </label>
        <label class="tone-option" data-value="professional">
          <input type="radio" name="tone" value="professional" /> Professional
        </label>
        <label class="tone-option" data-value="warm">
          <input type="radio" name="tone" value="warm" /> Warm
        </label>
      </div>

      <label for="signoffStyle">How replies should sign off <span style="font-weight:400;color:#5A7291">(optional)</span></label>
      <input type="text" id="signoffStyle" placeholder="e.g. – The Grub's Tubs Team" />

      <label>If a review needs more than a quick reply</label>
      <div class="hint">Anything scathing or a serious complaint always gets held for you personally, no matter what you pick here — this is just for the routine 3+ star stuff.</div>
      <select id="negativeReviewPolicy">
        <option value="apologize_and_offer_fix">Apologize and offer to make it right</option>
        <option value="defer_to_contact_us">Apologize and point them to contact us directly</option>
        <option value="custom">Custom instructions (write your own below)</option>
      </select>

      <div id="customInstructionWrap" style="display:none">
        <label for="customInstruction">Custom instructions</label>
        <textarea id="customInstruction" placeholder="e.g. Always mention our 30-day guarantee and offer a callback within 24 hours."></textarea>
      </div>

      <div id="error" class="error"></div>
      <button type="submit" class="submit-btn" id="submitBtn">Save & Continue</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const loadingEl = document.getElementById('loading');
    const formEl = document.getElementById('onboarding-form');
    const errorEl = document.getElementById('error');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    async function loadBusiness(attempt) {
      if (!sessionId) {
        loadingEl.textContent = "We couldn't find your checkout session — please use the link from your confirmation email, or email support@compassbizsolutions.com.";
        return;
      }
      try {
        const r = await fetch('/api/reviewkit-session-lookup?session_id=' + encodeURIComponent(sessionId));
        if (r.status === 202) {
          // Webhook hasn't finished yet — retry a few times before giving up.
          if (attempt < 6) {
            setTimeout(() => loadBusiness(attempt + 1), 1500);
            return;
          }
          loadingEl.textContent = "Still setting up your account — refresh this page in a moment, or email support@compassbizsolutions.com if this doesn't clear up.";
          return;
        }
        const d = await r.json();
        if (!r.ok) {
          loadingEl.textContent = d.error || "Something went wrong loading your account.";
          return;
        }
        document.getElementById('businessId').value = d.businessId;
        if (d.name) document.getElementById('businessName').value = d.name;
        loadingEl.style.display = 'none';
        formEl.style.display = 'block';
      } catch (e) {
        loadingEl.textContent = "Couldn't reach the server. Please refresh this page.";
      }
    }
    loadBusiness(0);

    document.querySelectorAll('.tone-option').forEach((el) => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.tone-option').forEach((o) => o.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
      });
    });

    const policySelect = document.getElementById('negativeReviewPolicy');
    const customWrap = document.getElementById('customInstructionWrap');
    policySelect.addEventListener('change', () => {
      customWrap.style.display = policySelect.value === 'custom' ? 'block' : 'none';
    });

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      const tone = document.querySelector('input[name=tone]:checked').value;

      try {
        const r = await fetch('/api/reviewkit-onboarding-save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            businessId: document.getElementById('businessId').value,
            businessName: document.getElementById('businessName').value,
            tone,
            signoffStyle: document.getElementById('signoffStyle').value,
            negativeReviewPolicy: policySelect.value,
            customInstruction: document.getElementById('customInstruction').value
          })
        });
        const d = await r.json();
        if (!r.ok) {
          showError(d.error || 'Something went wrong. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save & Continue';
          return;
        }
        window.location.href = '/reviewkit/welcome';
      } catch (e) {
        showError('Could not reach the server. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save & Continue';
      }
    });
  </script>
</body>
</html>
